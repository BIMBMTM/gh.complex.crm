<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH.Complex • CRM & Ads Intelligence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg:#e9eaf2; --bg2:#eeeef6;
  --card:#f4f4fa; --card2:#eeeef6;
  --brand:#2c2a6b;
  --accent:#3f3d99; --accent2:#5b57c9; --accent-soft:#e7e6f6;
  --ink:#1d1b3a; --ink2:#36345e; --muted:#6a6a86; --line:#e0e0ee;
  --good:#16a34a; --warn:#d97706; --bad:#e11d48; --info:#0891b2;
  --pink:#d6336c; --purple:#7c3aed; --teal:#0d9488; --orange:#ea580c;
  --sh-dark:rgba(160,162,196,.55); --sh-light:rgba(255,255,255,.95);
  --radius:20px;
  --font:'Be Vietnam Pro',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:linear-gradient(135deg,#eeeef6 0%,#e9eaf2 100%);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c7c7dd;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Neumorphic helpers ---------- */
.neu{background:var(--card);border-radius:var(--radius);
  box-shadow:-7px -7px 16px var(--sh-light), 9px 9px 22px var(--sh-dark);}
.neu-in{background:var(--card);border-radius:14px;
  box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);}
.neu-soft{background:var(--card);border-radius:16px;
  box-shadow:-4px -4px 11px var(--sh-light), 6px 6px 15px var(--sh-dark);}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1000;
  background:radial-gradient(1200px 600px at 30% 20%,#f1f1f9 0%,#e7e7f1 55%,#e0e0ec 100%);}
.login-card{width:min(410px,92vw);padding:38px 34px;border-radius:28px;text-align:center;
  background:var(--card);box-shadow:-9px -9px 22px var(--sh-light), 12px 12px 30px var(--sh-dark);}
.login-card .logo-wrap{display:flex;justify-content:center;margin-bottom:8px}
.login-card h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-top:14px}
.login-card .sub{color:var(--muted);font-size:13px;margin:6px 0 26px;font-weight:500}
.fld{text-align:left;margin-bottom:16px}
.fld label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;display:block;padding-left:4px}
.fld input{width:100%;border:none;outline:none;padding:14px 16px;border-radius:13px;font-family:var(--font);
  font-size:14px;color:var(--ink);background:var(--card);
  box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);}
.fld input:focus{box-shadow:inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light),0 0 0 2px var(--accent-soft)}
.btn-login{width:100%;border:none;cursor:pointer;padding:14px;border-radius:13px;color:#fff;font-weight:700;font-size:15px;
  font-family:var(--font);background:linear-gradient(135deg,var(--brand) 0%,var(--accent2) 100%);
  box-shadow:0 8px 18px rgba(44,42,107,.32);transition:.2s;margin-top:6px}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(44,42,107,.42)}
.btn-login:active{transform:translateY(0)}
.login-err{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:14px;min-height:18px}
.login-foot{margin-top:22px;font-size:11px;color:#94a3b8}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;padding:22px 16px;display:flex;flex-direction:column;gap:8px;
  position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#eef1f7,#e8ecf3)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
.brand .name{font-weight:800;font-size:16px;letter-spacing:-.3px;line-height:1.1}
.brand .name small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.nav-group{font-size:10.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink2);transition:.18s;border:none;background:transparent;width:100%;text-align:left;font-family:var(--font)}
.nav-item:hover{background:rgba(255,255,255,.6)}
.nav-item.active{background:var(--card);color:var(--accent);
  box-shadow:-3px -3px 8px var(--sh-light), 4px 4px 11px var(--sh-dark)}
.nav-item .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft)}
.nav-item.active .ic{background:var(--accent);}
.nav-item.active .ic svg{stroke:#fff}
.nav-item .ic svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2}
.side-foot{margin-top:auto;padding-top:14px}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;font-size:12px}
.user-chip .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.user-chip .who{font-weight:700;font-size:12.5px;color:var(--ink)}
.user-chip .who small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
.btn-logout{margin-top:8px;width:100%;border:none;cursor:pointer;padding:9px;border-radius:11px;font-family:var(--font);
  font-size:12px;font-weight:600;color:var(--muted);background:var(--card);
  box-shadow:-2px -2px 6px var(--sh-light),3px 3px 8px var(--sh-dark)}
.btn-logout:hover{color:var(--bad)}

.main{flex:1;min-width:0;padding:22px 26px 50px;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-title h2{font-size:23px;font-weight:800;letter-spacing:-.5px}
.page-title p{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}

/* ---------- Filters ---------- */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill-toggle{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--card);
  box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light)}
.pill-toggle button{border:none;cursor:pointer;padding:8px 16px;border-radius:999px;font-family:var(--font);
  font-size:12.5px;font-weight:600;color:var(--muted);background:transparent;transition:.18s}
.pill-toggle button.active{background:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(44,42,107,.32)}
.sel,.ms-trigger{border:none;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--ink2);
  padding:10px 14px;border-radius:12px;background:var(--card);
  box-shadow:-2px -2px 6px var(--sh-light),3px 3px 8px var(--sh-dark);outline:none}
.sel:focus{box-shadow:inset 2px 2px 6px var(--sh-dark),inset -2px -2px 6px var(--sh-light)}
.ms{position:relative}
.ms-trigger{display:flex;align-items:center;gap:8px}
.ms-trigger .cnt{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700}
.ms-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;min-width:230px;max-height:300px;overflow:auto;
  padding:8px;border-radius:14px;background:var(--card);box-shadow:0 12px 30px rgba(50,60,90,.22),-3px -3px 9px var(--sh-light)}
.ms-panel.open{display:block}
.ms-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:500}
.ms-opt:hover{background:var(--bg)}
.ms-opt input{accent-color:var(--accent);width:15px;height:15px}
.ms-actions{display:flex;gap:6px;padding:6px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ms-actions button{flex:1;border:none;background:var(--bg);border-radius:8px;padding:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--ink2)}

/* ---------- Pages / Tabs ---------- */
.section{display:none}.section.active{display:block}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:none;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--muted);
  padding:9px 16px;border-radius:12px;background:var(--card);transition:.18s;
  box-shadow:-2px -2px 6px var(--sh-light),3px 3px 8px var(--sh-dark)}
.tab.active{color:var(--accent);box-shadow:inset 3px 3px 7px var(--sh-dark),inset -3px -3px 7px var(--sh-light)}
.page{display:none;animation:fade .35s ease}.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Grid & Cards ---------- */
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{padding:20px 22px;border-radius:var(--radius);background:var(--card);
  box-shadow:-7px -7px 16px var(--sh-light), 9px 9px 22px var(--sh-dark)}
.card h3{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:3px}
.card .csub{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-head h3{margin:0}

/* KPI card */
.kpi{padding:20px;border-radius:var(--radius);background:var(--card);
  box-shadow:-7px -7px 16px var(--sh-light), 9px 9px 22px var(--sh-dark);position:relative;overflow:hidden}
.kpi .kicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.kpi .kicon svg{width:23px;height:23px;stroke-width:2;fill:none}
.kpi .klabel{font-size:12px;color:var(--muted);font-weight:600}
.kpi .kval{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:3px;color:var(--ink)}
.kpi .kfoot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;font-weight:600}
.kpi .trend{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:700}
.trend.up{background:#dcfce7;color:#16a34a}.trend.down{background:#fee2e2;color:#dc2626}.trend.flat{background:#e2e8f0;color:#64748b}
/* pastel icon backgrounds */
.bg-blue{background:#e3edff;color:var(--accent)} .bg-pink{background:#ffe3ef;color:var(--pink)}
.bg-purple{background:#f0e3ff;color:var(--purple)} .bg-teal{background:#d6f5f1;color:var(--teal)}
.bg-orange{background:#ffe9d6;color:var(--orange)} .bg-green{background:#dcf7e8;color:var(--good)}
.bg-red{background:#ffe1e1;color:var(--bad)} .bg-info{background:#dcf2ff;color:var(--info)}
.bg-slate{background:#e6eaf3;color:#475569}

/* chart wrap */
.chart-box{position:relative;width:100%}
.h220{height:220px}.h260{height:260px}.h300{height:300px}.h340{height:340px}
.donut-legend{display:flex;flex-direction:column;gap:9px;justify-content:center}
.lg-item{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600}
.lg-dot{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.lg-item .v{margin-left:auto;color:var(--muted);font-weight:700}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:center}
@media(max-width:560px){.split{grid-template-columns:1fr}}

/* progress */
.prow{margin-bottom:14px}
.prow .pl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px}
.prow .pl .pv{color:var(--muted)}
.pbar{height:9px;border-radius:999px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--sh-dark)}
.pbar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px}
.fn-row{display:flex;align-items:center;gap:12px}
.fn-bar{height:38px;border-radius:11px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:13px;min-width:70px;transition:width .8s ease;white-space:nowrap}
.fn-meta{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}

/* table */
.tbl-wrap{overflow:auto;border-radius:14px;box-shadow:inset 3px 3px 8px var(--sh-dark),inset -3px -3px 8px var(--sh-light);max-height:560px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
thead th{position:sticky;top:0;background:#e4e9f3;color:var(--ink2);font-weight:700;text-align:right;padding:11px 12px;white-space:nowrap;z-index:2;border-bottom:2px solid #d4dbe9}
thead th:first-child,tbody td:first-child{text-align:left;position:sticky;left:0;background:#e9edf5;z-index:1}
thead th:first-child{z-index:3;background:#e4e9f3}
tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500;color:var(--ink2)}
tbody tr:hover td{background:#eaeef6}
.badge{display:inline-block;padding:2px 9px;border-radius:8px;font-size:10.5px;font-weight:700}
.tag-good{background:#dcfce7;color:#16a34a}.tag-warn{background:#fef3c7;color:#b45309}.tag-bad{background:#fee2e2;color:#dc2626}.tag-info{background:#dbeafe;color:#2563eb}.tag-mut{background:#e2e8f0;color:#64748b}

/* alerts / insights */
.insight{display:flex;gap:12px;padding:13px 15px;border-radius:13px;margin-bottom:10px;font-size:12.5px;font-weight:500;line-height:1.5}
.insight .di{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center}
.insight.ok{background:#ecfdf3}.insight.ok .di{background:#dcf7e8;color:var(--good)}
.insight.warn{background:#fffbeb}.insight.warn .di{background:#ffe9d6;color:var(--orange)}
.insight.bad{background:#fef2f2}.insight.bad .di{background:#ffe1e1;color:var(--bad)}
.insight.info{background:#eff6ff}.insight.info .di{background:#e3edff;color:var(--accent)}
.insight b{color:var(--ink);font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px}
.cal .cell{min-height:78px;border-radius:12px;background:var(--card);padding:7px 8px;
  box-shadow:inset 2px 2px 6px var(--sh-dark),inset -2px -2px 6px var(--sh-light);font-size:11px}
.cal .cell.empty{box-shadow:none;background:transparent}
.cal .cell .d{font-weight:700;color:var(--ink2);font-size:12px}
.cal .cell.has{box-shadow:-2px -2px 6px var(--sh-light),3px 3px 9px var(--sh-dark)}
.cal .ev{margin-top:4px;font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:2px 5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* loading */
#loader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:900;background:rgba(232,236,243,.85);backdrop-filter:blur(3px)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid #d4dbe9;border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loader p{font-size:13px;font-weight:600;color:var(--ink2)}

.empty-note{padding:30px;text-align:center;color:var(--muted);font-size:13px;font-weight:500}
.hl{color:var(--accent);font-weight:700}
.mini-kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.mini{flex:1;min-width:130px;padding:14px 16px;border-radius:15px;background:var(--card);box-shadow:-3px -3px 9px var(--sh-light),5px 5px 13px var(--sh-dark)}
.mini .ml{font-size:11px;color:var(--muted);font-weight:600}
.mini .mv{font-size:19px;font-weight:800;margin-top:3px}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend-row .lg-item{font-size:11.5px}
@media(max-width:900px){.side{position:fixed;left:-260px;transition:.3s;z-index:200;box-shadow:8px 0 30px rgba(0,0,0,.15)}.side.show{left:0}.menu-btn{display:grid !important}}
.menu-btn{display:none;width:40px;height:40px;border-radius:11px;border:none;background:var(--card);cursor:pointer;place-items:center;box-shadow:-2px -2px 6px var(--sh-light),3px 3px 8px var(--sh-dark)}

/* date range + load */
.date-inp{border:none;outline:none;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--ink2);padding:9px 11px;border-radius:11px;background:var(--card);box-shadow:inset 2px 2px 6px var(--sh-dark),inset -2px -2px 6px var(--sh-light)}
.date-sep{font-size:12px;color:var(--muted);font-weight:600}
.btn-load{border:none;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:700;color:#fff;padding:10px 16px;border-radius:12px;
  background:linear-gradient(135deg,var(--brand),var(--accent2));box-shadow:0 6px 14px rgba(44,42,107,.30);transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn-load:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(44,42,107,.40)}
.btn-load:disabled{opacity:.6;cursor:default;transform:none}
.btn-load svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2}
.data-stamp{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(22,163,74,.18)}

/* metric chip selector */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:none;cursor:pointer;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:-2px -2px 6px var(--sh-light),3px 3px 7px var(--sh-dark);transition:.15s}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--brand),var(--accent2));box-shadow:0 4px 9px rgba(44,42,107,.28)}

/* collapsible post rows */
.exp-row{cursor:pointer}
.exp-row:hover{background:rgba(63,61,153,.04)}
.exp-caret{display:inline-block;transition:.2s;color:var(--accent);font-weight:800;margin-right:4px}
.exp-row.open .exp-caret{transform:rotate(90deg)}
.exp-detail{display:none;background:var(--bg2)}
.exp-detail.show{display:table-row}
.exp-detail td{padding:0 !important}
.exp-inner{padding:10px 14px}
.exp-inner table{width:100%;border-collapse:collapse;font-size:11px}
.exp-inner th,.exp-inner td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
.exp-inner th:first-child,.exp-inner td:first-child{text-align:left}
.exp-inner th{color:var(--muted);font-weight:700;font-size:10.5px}

/* best-post cards */
.bp{display:flex;flex-direction:column;gap:9px}
.bp .top{display:flex;align-items:center;gap:11px}
.bp .big{font-size:19px;font-weight:800;color:var(--ink);line-height:1}
.bp .bl{font-size:11px;color:var(--muted);font-weight:600}
.bp .meta{display:flex;flex-wrap:wrap;gap:6px}
.bp a{font-size:11px;color:var(--accent);font-weight:700;text-decoration:none;word-break:break-all}

.cal-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.cal-wrap{grid-template-columns:1fr}}

/* topbar icon buttons */
.icon-btn{width:40px;height:40px;border-radius:11px;border:none;background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--ink2);
  box-shadow:-2px -2px 6px var(--sh-light),3px 3px 8px var(--sh-dark);transition:.15s;flex:0 0 auto}
.icon-btn:hover{color:var(--accent)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* collapsible sidebar (desktop) */
.side{transition:width .22s ease,flex-basis .22s ease}

function deobf(b64){const raw=atob(b64);const k=X_KEY;let o='';for(let i=0;i<raw.length;i++){o+=String.fromCharCode(raw.charCodeAt(i)^k.charCodeAt(i%k.length));}return o;}
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const VNF=new Intl.NumberFormat('vi-VN');
function nf(n){n=+n||0;return VNF.format(Math.round(n));}
function vnd(n){return nf(n)+' ₫';}
function vndC(n){n=+n||0;if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+' tỷ';if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+' tr';if(Math.abs(n)>=1e3)return (n/1e3).toFixed(0)+'k';return nf(n)+' ₫';}
function numC(n){n=+n||0;if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(Math.abs(n)>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return nf(n);}
function pct(n,d=1){return (isFinite(n)?(+n).toFixed(d):'0')+'%';}

function parseDate(v){
  if(v==null)return null; if(v instanceof Date)return v;
  let s=String(v).trim(); if(!s)return null;
  s=s.replace(/\s+\d{1,2}:\d{2}.*$/,'');
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    if(a>12)return new Date(y,b-1,a);
    if(b>12)return new Date(y,a-1,b);
    return new Date(y,b-1,a);
  }
  const d=new Date(s);return isNaN(d)?null:d;
}
function ymd(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';}
function dmy(d){return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'';}

function papa(url){return new Promise((res,rej)=>{Papa.parse(url,{download:true,header:true,skipEmptyLines:'greedy',
  complete:r=>res(r.data),error:e=>rej(e)});});}
function norm(h){return String(h||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');}
function buildMap(rows,defs){
  const map={}; if(!rows.length)return map;
  const headers=Object.keys(rows[0]); const nh=headers.map(h=>({raw:h,n:norm(h)}));
  for(const key in defs){const cands=defs[key];let hit=null;
    for(const c of cands){const f=nh.find(x=>x.n===c);if(f){hit=f.raw;break;}}
    if(!hit)for(const c of cands){const f=nh.find(x=>x.n.includes(c)||c.includes(x.n)&&x.n.length>2);if(f){hit=f.raw;break;}}
    if(hit)map[key]=hit;
  } return map;
}
function num(v){if(v==null)return 0;let s=String(v).replace(/[₫$,%\s]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n;}

function stageKey(s){const n=norm(s);
 if(!n)return 'unknown';
 if(n.includes('book'))return 'booked';

 if(n.includes('khachmoi')||n.includes('new')||n.includes('moi'))return 'new';
 return 'other';}

async function loadAllData(){
  document.getElementById('loader').style.display='flex';
  async function fetchBoth(){return Promise.all([papa(deobf(CSV_ADS_OBF)),papa(deobf(CSV_LEAD_OBF))]);}
  try{
    let a,l;
    try{[a,l]=await fetchBoth();}
    catch(e1){await new Promise(r=>setTimeout(r,800));[a,l]=await fetchBoth();} // retry once
    ADS_MAP=buildMap(a,ADS_DEFS); LEAD_MAP=buildMap(l,LEAD_DEFS);
    ADS=a.map(r=>{const g=k=>r[ADS_MAP[k]];const d=parseDate(g('date'));return d?{
      date:d,ym:d.getFullYear()+'-'+d.getMonth(),y:d.getFullYear(),mo:d.getMonth(),
      url:(g('url')||'').trim(),goal:(g('goal')||'—').trim(),delivery:(g('delivery')||'—').trim(),
      type:typeLabel(g('type')),rawtype:(g('type')||'').trim(),
      spend:num(g('spend')),reach:num(g('reach')),impr:num(g('impr')),eng:num(g('eng')),
      comments:num(g('comments')),msg:num(g('msg')),clicks:num(g('clicks')),linkclicks:num(g('linkclicks')),
      newmsg:num(g('newmsg')),platform:(g('platform')||'—').trim(),thruplay:num(g('thruplay'))
    }:null;}).filter(Boolean);
    LEADS=l.map(r=>{const g=k=>r[LEAD_MAP[k]];const d=parseDate(g('date'));return d?{
      date:d,y:d.getFullYear(),mo:d.getMonth(),
      stage:(g('stage')||'').trim(),sk:stageKey(g('stage')),
      etype:(g('etype')||'Khác').trim()||'Khác',esize:(g('esize')||'Khác').trim()||'Khác',

      value:num(g('value')),edate:parseDate(g('edate'))

    DATA_READY=true; LAST_LOAD=new Date();

  }finally{document.getElementById('loader').style.display='none';renderFilters();}
}

/* ===================== PERIOD SLICING ===================== */
function leadsY(){return LEADS.filter(x=>x.y===STATE.year);}
function adsAll(){return ADS.filter(x=>STATE.adGoal.includes(x.goal)&&STATE.adDelivery.includes(x.delivery)&&STATE.adType.includes(x.type));}
function inPeriod(x,y,m){return x.y===y&&(m==='all'||x.mo===m);}
function dOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,d.getDate());}
function inRange(dt,a,b){const t=dOnly(dt).getTime();return t>=a.getTime()&&t<=b.getTime();}
function eachDay(a,b){const out=[];let d=new Date(a);while(d<=b){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}return out;}

function period(){
  if(STATE.mode==='range'&&STATE.from&&STATE.to){
    let a=dOnly(parseDate(STATE.from)),b=dOnly(parseDate(STATE.to));
    if(a>b){const t=a;a=b;b=t;}
    // MoM previous = same span shifted back one month
    const pa=dOnly(addMonths(a,-1)),pb=dOnly(addMonths(b,-1));
    const AD=adsAll();
    const fmt=d=>dmy(d);
    return {mode:'range',isMonth:false,from:a,to:b,pfrom:pa,pto:pb,
      leadsP:LEADS.filter(x=>inRange(x.date,a,b)),
      adsP:AD.filter(x=>inRange(x.date,a,b)),
      leadsPrev:LEADS.filter(x=>inRange(x.date,pa,pb)),
      adsPrev:AD.filter(x=>inRange(x.date,pa,pb)),
      days:eachDay(a,b),
      label:fmt(a)+' – '+fmt(b),prevLabel:fmt(pa)+' – '+fmt(pb),
      y:a.getFullYear(),m:a.getMonth()};
  }
  const m=STATE.month,y=STATE.year;const isMonth=m!=='all';
  let pm=m,py=y;if(isMonth){pm=m-1;if(pm<0){pm=11;py=y-1;}}else{py=y-1;}
  const AD=adsAll();
  return {mode:'month',y,m,isMonth,py,pm,
    leadsP:LEADS.filter(x=>inPeriod(x,y,m)),
    adsP:AD.filter(x=>inPeriod(x,y,m)),
    leadsPrev:LEADS.filter(x=>inPeriod(x,py,isMonth?pm:'all')),
    adsPrev:AD.filter(x=>inPeriod(x,py,isMonth?pm:'all')),
    label:isMonth?('Tháng '+(m+1)+'/'+y):('Năm '+y),
    prevLabel:isMonth?('Tháng '+(pm+1)+'/'+py):('Năm '+py)};
}
// generic day/month series over a period for ANY field, returns {lab,val,labFull(dates)}
function seriesOf(arr,P,field,fn){
  if(P.mode==='range'){const days=P.days;const m=leadsOrAdsByDay(arr);
    return {lab:days.map(d=>d.getDate()+'/'+(d.getMonth()+1)),val:days.map(d=>agg(m[ymd(d)]||[],field,fn)),dates:days};}
  if(P.isMonth){const dim=new Date(P.y,P.m+1,0).getDate();const days=Array.from({length:dim},(_,i)=>new Date(P.y,P.m,i+1));
    const m=leadsOrAdsByDay(arr);return {lab:days.map(d=>d.getDate()),val:days.map(d=>agg(m[ymd(d)]||[],field,fn)),dates:days};}
  return {lab:MONTHS,val:MONTHS.map((_,i)=>agg(arr.filter(x=>x.mo===i),field,fn)),dates:null};
}
function leadsOrAdsByDay(arr){const m={};arr.forEach(r=>{const k=ymd(r.date);(m[k]=m[k]||[]).push(r);});return m;}
function agg(rows,field,fn){if(fn)return fn(rows);return rows.reduce((a,b)=>a+(+b[field]||0),0);}

/* ===================== AGGREGATIONS ===================== */
function sumAds(arr){const k=['spend','reach','impr','eng','comments','msg','clicks','linkclicks','newmsg','thruplay'];const o={};k.forEach(x=>o[x]=0);arr.forEach(r=>k.forEach(x=>o[x]+=r[x]));
  o.cpm=div(o.spend,o.impr)*1000;o.cpc=div(o.spend,o.linkclicks);o.ctr=div(o.linkclicks,o.impr)*100;
  o.freq=div(o.impr,o.reach);o.cpl=div(o.spend,o.msg);o.cpnewmsg=div(o.spend,o.newmsg);o.engrate=div(o.eng,o.reach)*100;return o;}
function countBy(arr,fn){const m={};arr.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+1;});return m;}
function sumBy(arr,fn,val){const m={};arr.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+(val?val(x):1);});return m;}
function bookedCount(arr){return arr.filter(x=>x.sk==='booked').length;}
function trendArrow(cur,prev){const d=div(cur-prev,Math.abs(prev||1))*100;if(prev===0&&cur===0)return{cls:'flat',t:'0%'};if(prev===0)return{cls:'up',t:'mới'};return {cls:d>0.5?'up':d<-0.5?'down':'flat',t:(d>0?'▲':d<0?'▼':'')+pct(Math.abs(d))};}

function rBizOverview(){
  const P=period();const lp=P.leadsP,lprev=P.leadsPrev;
  const tot=lp.length,bk=bookedCount(lp),totPrev=lprev.length,bkPrev=bookedCount(lprev);
  const unq=lp.filter(x=>x.sk==='unqualified').length, rej=lp.filter(x=>x.sk==='rejected').length;
  const unqPrev=lprev.filter(x=>x.sk==='unqualified').length;
  const qualRate=div(tot-unq,tot)*100, qualRatePrev=div(totPrev-unqPrev,totPrev)*100;
  const closeRate=div(bk,tot)*100, closeRatePrev=div(bkPrev,totPrev)*100;
  const active=lp.filter(x=>['new','consult','sitecheck','negotiate'].includes(x.sk)).length;
  const activePrev=lprev.filter(x=>['new','consult','sitecheck','negotiate'].includes(x.sk)).length;
  const ap=sumAds(P.adsP),apv=sumAds(P.adsPrev);
  const hasVal=LEADS.some(x=>x.value>0);
  const rev=lp.filter(x=>x.sk==='booked').reduce((a,b)=>a+b.value,0);
  const revPrev=lprev.filter(x=>x.sk==='booked').reduce((a,b)=>a+b.value,0);

  let kpis=[
    kpi({ic:'target',color:'bg-blue',label:'Tổng Lead',val:nf(tot),trend:trendArrow(tot,totPrev),foot:P.prevLabel+': '+nf(totPrev)}),
    kpi({ic:'chart',color:'bg-green',label:'Booking 🥂',val:nf(bk),trend:trendArrow(bk,bkPrev),foot:P.prevLabel+': '+nf(bkPrev)}),
    kpi({ic:'trend',color:'bg-purple',label:'Tỷ lệ chốt',val:pct(closeRate),trend:trendArrow(closeRate,closeRatePrev),foot:P.prevLabel+': '+pct(closeRatePrev)}),
    kpi({ic:'shield',color:'bg-teal',label:'Chất lượng lead',val:pct(qualRate),trend:trendArrow(qualRate,qualRatePrev),foot:nf(unq)+' lead unqualified'}),
    kpi({ic:'list',color:'bg-orange',label:'Đang trong pipeline',val:nf(active),trend:trendArrow(active,activePrev),foot:'lead đang tư vấn/thương thảo'}),
    kpi({ic:'wallet',color:'bg-pink',label:'Chi phí QC',val:vndC(ap.spend),trend:trendArrow(apv.spend,ap.spend),foot:'CPL '+(ap.msg?vndC(ap.cpl):'—')}),
    hasVal?kpi({ic:'doc',color:'bg-info',label:'Doanh thu booked (ước tính)',val:vndC(rev),trend:trendArrow(rev,revPrev),foot:P.prevLabel+': '+vndC(revPrev)}):null,
    kpi({ic:'cal',color:'bg-info',label:'Chi phí / booking',val:bk?vndC(div(ap.spend,bk)):'—',trend:bk&&bkPrev?trendArrow(div(apv.spend,bkPrev),div(ap.spend,bk)):null,foot:'blended'})
  ].filter(Boolean).join('');

  // highlight
  const tA=trendArrow(tot,totPrev),bA=trendArrow(bk,bkPrev);
  const hi=highlight([
    {type:bk>=bkPrev?'ok':'warn',icon:bk>=bkPrev?'trend':'info',html:`Kỳ <b>${P.label}</b>: <b>${nf(tot)}</b> lead (${tA.t} so với kỳ trước), chốt <b>${nf(bk)}</b> booking (${bA.t}), tỷ lệ chốt <b>${pct(closeRate)}</b>.`},
    {type:ap.msg&&ap.cpl<=(apv.cpl||1e18)?'ok':'info',icon:'wallet',html:`Chi quảng cáo <b>${vndC(ap.spend)}</b>, tạo <b>${nf(ap.msg)}</b> tin nhắn · CPL <b>${ap.msg?vndC(ap.cpl):'—'}</b>${apv.msg?` (kỳ trước ${vndC(apv.cpl)})`:''}.`}
  ]);

  // month comparison (selectable metric)
  const cmpMetric=STATE.cmpMetric||'leadbook';
  const CMP={leadbook:'Lead & Booking',close:'Tỷ lệ chốt (%)',spend:'Chi phí QC',msg:'Tin nhắn QC',cpl:'CPL'};
  const adsByMo=i=>sumAds(adsAll().filter(x=>x.y===P.y&&x.mo===i));
  const byMo=MONTHS.map((_,i)=>{const a=leadsY().filter(x=>x.mo===i);const s=adsByMo(i);
    return {leads:a.length,booked:bookedCount(a),close:div(bookedCount(a),a.length)*100,spend:s.spend,msg:s.msg,cpl:s.cpl};});
  const cmpChips=`<div class="chips">`+Object.entries(CMP).map(([k,l])=>`<button class="chip ${k===cmpMetric?'on':''}" onclick="setCmp('${k}')">${l}</button>`).join('')+`</div>`;

  // selectable daily trend (this period vs prev dashed)

function rBizDaily(){
  const P=period();
  let days;
  if(P.mode==='range')days=P.days;
  else if(P.isMonth){const dim=new Date(P.y,P.m+1,0).getDate();days=Array.from({length:dim},(_,i)=>new Date(P.y,P.m,i+1));}
  else{setC(`<div class="card"><div class="empty-note">Chọn <b>một tháng cụ thể</b> hoặc chuyển sang <b>Khoảng ngày</b> để xem bảng chi tiết theo ngày.</div></div>`);return;}
  const adMap=adsByDayMap(P.adsP),ldMap=leadDayRows(P.leadsP);
  const rows=[];let tL=0,tB=0,tS=0,tM=0;
  days.forEach(dt=>{
    const key=ymd(dt);
    const ld=ldMap[key]||[];const ad=adMap[key]||[];const s=sumAds(ad);
    const leads=ld.length,bk=ld.filter(x=>x.sk==='booked').length;
    tL+=leads;tB+=bk;tS+=s.spend;tM+=s.msg;
    let flag=tag('Bình thường','tag-mut');
    if(s.spend>0&&s.msg===0)flag=tag('⚠ Tốn phí · 0 tin nhắn','tag-bad');
    else if(s.spend>0&&leads===0)flag=tag('⚠ Có phí · 0 lead','tag-warn');
    else if(bk>0)flag=tag('★ Có booking','tag-good');
    else if(leads>0)flag=tag('Có lead','tag-info');
    if(leads===0&&s.spend===0)return;
    rows.push([dmy(dt),nf(leads),nf(bk),s.spend?vnd(s.spend):'—',nf(s.msg),s.msg?vnd(s.cpl):'—',leads?vndC(div(s.spend,leads)):'—',nf(s.reach),nf(s.impr),s.impr?pct(s.ctr):'—',flag]);
  });
  // MoM prev totals
  const sv=sumAds(P.adsPrev);const tLp=P.leadsPrev.length,tBp=bookedCount(P.leadsPrev);
  const mc=(l,v,prev,col,fmt)=>{const f=fmt||nf;const t=trendArrow(v,prev);return `<div class="mini"><div class="ml">${l}</div><div class="mv" ${col?`style="color:${col}"`:''}>${f(v)}</div><div style="font-size:11px;font-weight:700;margin-top:2px" class="trend ${t.cls}">${t.t} <span style="color:var(--muted);font-weight:500">vs kỳ trước</span></div></div>`;};
  let html=highlight([
    {type:tB>=tBp?'ok':'warn',icon:tB>=tBp?'trend':'info',html:`Kỳ <b>${P.label}</b>: <b>${nf(tL)}</b> lead · <b>${nf(tB)}</b> booking · chi QC <b>${vndC(tS)}</b> · CPL blended <b>${tM?vnd(tS/tM):'—'}</b>.`},
    {type:'info',icon:'list',html:`Cột "Cảnh báo" tự đánh dấu ngày tốn phí nhưng <b>0 tin nhắn / 0 lead</b> để xử lý nhanh.`}
  ]);
  html+=`<div class="mini-kpis">
    ${mc('Tổng lead',tL,tLp)}
    ${mc('Booking',tB,tBp,'var(--good)')}
    ${mc('Chi phí QC',tS,sv.spend,'var(--accent)',vndC)}
    ${mc('Tin nhắn QC',tM,sv.msg)}
    <div class="mini"><div class="ml">CPL blended</div><div class="mv">${tM?vnd(tS/tM):'—'}</div></div>
    <div class="mini"><div class="ml">Chi phí / booking</div><div class="mv">${tB?vndC(tS/tB):'—'}</div></div>
  </div>`;
  html+=card('Bảng hiệu suất chi tiết theo ngày · '+P.label,'Kết hợp lead, booking & chỉ số quảng cáo (ghép theo ngày) · cột "Cảnh báo" nêu vấn đề của ngày',
    buildTable(['Ngày','Lead','Booked','Chi phí QC','Tin nhắn','CPL','Chi phí/Lead','Tiếp cận','Hiển thị','CTR','Cảnh báo'],rows,980));

/* ========== BIZ • TRANG 3: LỊCH EVENT ========== */
function calGrid(y,m,evMap,labelFn){

  const dows=['CN','T2','T3','T4','T5','T6','T7'];
  let cells='';for(let i=0;i<7;i++)cells+=`<div class="dow">${dows[i]}</div>`;
  for(let i=0;i<first;i++)cells+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){const ev=evMap[d]||[];
    let inner=`<div class="d">${d}</div>`;ev.slice(0,3).forEach((e,i)=>inner+=`<div class="ev" style="background:${PAL[i%PAL.length]}" title="${esc(labelFn(e))}">${esc(labelFn(e))}</div>`);
    if(ev.length>3)inner+=`<div style="font-size:9px;color:var(--muted);margin-top:2px">+${ev.length-3}</div>`;
    cells+=`<div class="cell${ev.length?' has':''}">${inner}</div>`;}
  return `<div class="cal">${cells}</div>`;
}

/* ========== BIZ • TRANG 4: DỰ BÁO ========== */
function rBizForecast(){
  const P=period();const lp=P.leadsP,ap=P.adsP;
  let y=P.y,m=P.isMonth?P.m:(P.mode==='range'?P.from.getMonth():new Date().getMonth());
  if(P.mode==='range')y=P.from.getFullYear();
  const dim=new Date(y,m+1,0).getDate();
  const today=new Date();const isCurrent=(y===today.getFullYear()&&m===today.getMonth());
  const elapsed=isCurrent?Math.max(today.getDate(),1):dim;
  const leadsSoFar=lp.length,bkSoFar=bookedCount(lp),spendSoFar=ap.reduce((a,b)=>a+b.spend,0),msgSoFar=ap.reduce((a,b)=>a+b.msg,0);
  // daily avg & weekly avg projections
  const dailyAvg=div(leadsSoFar,elapsed), weeklyAvg=dailyAvg*7;
  const projDaily=Math.round(dailyAvg*dim);
  const weeksInMonth=dim/7; const projWeekly=Math.round(weeklyAvg*weeksInMonth);
  const projLeads=Math.round((projDaily+projWeekly)/2); // blend of two methods
  const bkDailyAvg=div(bkSoFar,elapsed),spendDailyAvg=div(spendSoFar,elapsed);
  const projBk=Math.round(bkDailyAvg*dim),projSpend=spendDailyAvg*dim;
  const histClose=div(bookedCount(LEADS),LEADS.length);
  const pipeline=lp.filter(x=>['new','consult','sitecheck','negotiate'].includes(x.sk)).length;
  const expFromPipe=Math.round(pipeline*histClose);
  const prevBk=bookedCount(P.leadsPrev);

  // cumulative daily series (actual to date) + projection line
  const days=Array.from({length:dim},(_,i)=>i+1);
  const ldMap=leadDayRows(lp);
  let cum=0;const cumLeads=days.map(d=>{if(isCurrent&&d>elapsed)return null;cum+=(ldMap[ymd(new Date(y,m,d))]||[]).length;return cum;});
  // projection trajectory from run-rate (straight line to projLeads)
  const projLine=days.map(d=>Math.round(dailyAvg*d));

  let html=highlight([
    {type:projBk>=prevBk?'ok':'warn',icon:projBk>=prevBk?'trend':'info',html:`Dự báo cuối kỳ: <b>${nf(projLeads)}</b> lead · <b>${nf(projBk)}</b> booking · chi QC <b>${vndC(projSpend)}</b>. Hiện đạt ${nf(leadsSoFar)} lead sau ${elapsed}/${dim} ngày.`},
    {type:'info',icon:'target',html:`Trung bình <b>${dailyAvg.toFixed(1)}</b> lead/ngày · <b>${weeklyAvg.toFixed(0)}</b> lead/tuần. Pipeline mở <b>${nf(pipeline)}</b> lead → kỳ vọng thêm <b>+${nf(expFromPipe)}</b> booking (tỷ lệ chốt LS ${pct(histClose*100)}).`}
  ]);
  html+=`<div class="grid g-kpi" style="margin-bottom:18px">
    ${kpi({ic:'target',color:'bg-blue',label:'Lead dự báo cuối kỳ',val:nf(projLeads),foot:'TB ngày '+projDaily+' · TB tuần '+projWeekly})}
    ${kpi({ic:'chart',color:'bg-green',label:'Booking dự báo',val:nf(projBk),trend:trendArrow(projBk,prevBk),foot:'hiện tại '+nf(bkSoFar)})}
    ${kpi({ic:'wallet',color:'bg-pink',label:'Chi phí QC dự báo',val:vndC(projSpend),foot:'đã chi '+vndC(spendSoFar)})}
    ${kpi({ic:'trend',color:'bg-purple',label:'Booking kỳ vọng từ pipeline',val:'+'+nf(expFromPipe),foot:nf(pipeline)+' lead × '+pct(histClose*100)})}
  </div>`;
  html+=`<div class="grid g-2" style="margin-bottom:18px">
    ${card('Lũy kế lead theo ngày','Thực đạt (lũy kế) vs Quỹ đạo run-rate · '+lblFc(y,m),'<div class="chart-box h300"><canvas id="chCum"></canvas></div>')}
    ${card('Thực tế vs Dự báo','Đến nay vs cuối kỳ','<div class="chart-box h300"><canvas id="chFc"></canvas></div>')}
  </div>`;
  html+=card('Cơ sở & giả định dự báo','Phương pháp tính',
      ins('info','info',`<b>Trung bình ngày:</b> ${dailyAvg.toFixed(2)} lead/ngày × ${dim} ngày = ${projDaily} lead. <b>Trung bình tuần:</b> ${weeklyAvg.toFixed(1)} lead/tuần × ${weeksInMonth.toFixed(1)} tuần = ${projWeekly} lead. Dự báo cuối kỳ lấy trung bình hai phương pháp.`)+
      ins('info','target',`Tỷ lệ chốt lịch sử toàn dữ liệu <b>${pct(histClose*100)}</b> dùng để ước lượng booking từ pipeline đang mở.`)+
      ins('warn','info',`Dự báo mang tính tham khảo; độ chính xác tăng khi đã qua giữa kỳ.`));
  setC(html);
  mkChart('chCum',{type:'line',data:{labels:days,datasets:[
    {label:'Lũy kế thực đạt',data:cumLeads,borderColor:C.accent,borderWidth:2.8,tension:.3,pointRadius:0,fill:true,backgroundColor:c=>grad(c.chart.ctx,c.chart.chartArea,'rgba(63,61,153,.18)',C.accentFill0)},
    {label:'Quỹ đạo run-rate',data:projLine,borderColor:C.orange,borderWidth:2,borderDash:[5,4],tension:.1,pointRadius:0,fill:false}]},
    options:{plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,padding:14}},datalabels:{display:false}},scales:{y:{...AXIS,beginAtZero:true},x:AXISX}}});
  mkChart('chFc',{type:'bar',data:{labels:['Lead','Booking','Chi phí (tr₫)'],datasets:[
    {label:'Hiện tại',data:[leadsSoFar,bkSoFar,+(spendSoFar/1e6).toFixed(1)],backgroundColor:C.accentLt,borderRadius:7,maxBarThickness:46},
    {label:'Dự báo cuối kỳ',data:[projLeads,projBk,+(projSpend/1e6).toFixed(1)],backgroundColor:C.accent,borderRadius:7,maxBarThickness:46}]},
    options:{plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,padding:14}},datalabels:{display:true,anchor:'end',align:'end',font:{weight:'700',size:10},color:C.ink,formatter:v=>v||''}},scales:{y:{...AXIS,beginAtZero:true},x:AXISX}}});
}

/* ========== BIZ • NGUỒN LEAD & ROI ========== */

/* ===================== ADS HELPERS ===================== */
function adsSeries(arr,P,field){const s=seriesOf(arr,P,field);return {lab:s.lab,val:s.val};}
function adsDayRows(arr){const m=adsByDayMap(arr);return Object.keys(m).sort().map(k=>{const s=sumAds(m[k]);s.day=k;return s;});}
function postsAgg(arr){const m={};arr.forEach(r=>{const k=r.url||'(không rõ link)';(m[k]=m[k]||[]).push(r);});
  return Object.entries(m).map(([url,rows])=>{const s=sumAds(rows);s.url=url;s.type=rows[0].type;s.goal=rows[0].goal;s.delivery=rows[0].delivery;s.n=rows.length;return s;});}
function shortUrl(u){if(!u)return '—';const m=u.match(/(\d{5,})/g);return m?('…/'+m[m.length-1]):(u.length>42?u.slice(0,40)+'…':u);}
function cmpTable(s,sp,Plab,Pprev){
  const R=(lab,cur,prev,fmt)=>{const f=fmt||nf;const t=trendArrow(cur,prev);return [lab,f(cur),f(prev),tag(t.t,t.cls==='up'?'tag-good':t.cls==='down'?'tag-bad':'tag-mut')];};
  return buildTable(['Chỉ số',Plab,Pprev,'Thay đổi'],[
    R('Chi tiêu (₫)',s.spend,sp.spend,vndC),
    R('Tiếp cận (Reach)',s.reach,sp.reach),
    R('Hiển thị (Impressions)',s.impr,sp.impr),
    R('Tin nhắn bắt đầu',s.msg,sp.msg),
    R('Liên hệ nhắn tin mới',s.newmsg,sp.newmsg),
    R('Tương tác bài viết',s.eng,sp.eng),
    R('Link click',s.linkclicks,sp.linkclicks),
    R('CPM (₫)',s.cpm,sp.cpm,vndC),
    R('CTR (%)',s.ctr,sp.ctr,v=>pct(v,2)),
    R('Chi phí / tin nhắn (CPL)',s.cpl,sp.cpl,vndC)
  ],560);
}

function rAdSumDaily(){
  const P=period();const rows=adsDayRows(P.adsP);

  const s=sumAds(P.adsP);const ldMap=leadDayRows(P.leadsP);
  const tLeads=P.leadsP.length,tBk=bookedCount(P.leadsP);
  const best=rows.slice().sort((a,b)=>(a.msg?a.cpl:1e18)-(b.msg?b.cpl:1e18))[0];
  const worst=rows.filter(r=>r.spend>0&&r.msg===0).sort((a,b)=>b.spend-a.spend)[0];
  let html=highlight([
    {type:'info',icon:'wallet',html:`Kỳ <b>${P.label}</b>: chi <b>${vndC(s.spend)}</b> qua <b>${rows.length}</b> ngày, tạo <b>${nf(s.msg)}</b> tin nhắn → <b>${nf(tLeads)}</b> lead, <b>${nf(tBk)}</b> booking (ghép theo ngày).`},

  ]);
  html+=`<div class="grid g-kpi" style="margin-bottom:18px">

    ${kpi({ic:'target',color:'bg-purple',label:'Tin nhắn / ngày (TB)',val:(div(s.msg,rows.length)).toFixed(1),foot:nf(s.msg)+' tin nhắn'})}
    ${kpi({ic:'chart',color:'bg-orange',label:'CPL trung bình',val:s.msg?vndC(s.cpl):'—',foot:'toàn kỳ'})}

  const tRows=rows.map(r=>{const d=parseDate(r.day);const ld=ldMap[r.day]||[];const leads=ld.length,bk=ld.filter(x=>x.sk==='booked').length;return [
    dmy(d),vndC(r.spend),numC(r.reach),numC(r.impr),nf(r.msg),
    nf(leads),nf(bk),leads?vndC(div(r.spend,leads)):'—',r.msg?vndC(r.cpl):'—',pct(r.ctr,2),
    r.spend>0&&r.msg===0?tag('⚠ 0 tin nhắn','tag-bad'):bk>0?tag('★ Có booking','tag-good'):r.msg&&r.cpl<=(s.cpl||1e18)?tag('Tốt','tag-good'):tag('—','tag-mut')
  ];});
  html+=card('Bảng tổng hợp theo ngày','Chỉ số quảng cáo + lead & booking thực tế (ghép theo ngày)',buildTable(
    ['Ngày','Chi tiêu','Reach','Hiển thị','Tin nhắn','Lead','Booked','Chi phí/Lead','CPL','CTR','Đánh giá'],tRows,940));
  if(best&&best.msg)html+=ins('ok','trend',`Ngày hiệu quả nhất: <b>${dmy(parseDate(best.day))}</b> với CPL <b>${vndC(best.cpl)}</b> (${nf(best.msg)} tin nhắn / ${vndC(best.spend)}).`);
  setC(`<div>${html}</div>`);
  mkChart('chSumDay',{type:'bar',data:{labels:ser.lab,datasets:[{label:'Chi tiêu (₫)',data:ser.val,backgroundColor:(c)=>grad(c.chart.ctx,c.chart.chartArea,C.accent2,C.accentLt),borderRadius:6,maxBarThickness:30}]},

/* ========== QC CHI TIẾT • TRANG 2: CHI TIẾT THEO NGÀY ========== */
function rAdpDaily(){
  const P=period();const rows=adsDayRows(P.adsP);
  if(!rows.length){setC('<div class="card"><div class="empty-note">Không có dữ liệu quảng cáo trong '+P.label+'.</div></div>'+dataNote(ADS_MAP,ADS_DEFS,'Ads Data'));return;}
  const s=sumAds(P.adsP);
  const withMsg=rows.filter(r=>r.msg>0);
  const bestCpl=withMsg.slice().sort((a,b)=>a.cpl-b.cpl)[0];
  const worstCpl=withMsg.slice().sort((a,b)=>b.cpl-a.cpl)[0];
  const noMsg=rows.filter(r=>r.spend>0&&r.msg===0);
  const topReach=rows.slice().sort((a,b)=>b.reach-a.reach)[0];
  let kpis=[
    kpi({ic:'wallet',color:'bg-blue',label:'Tổng chi '+P.label,val:vndC(s.spend),foot:rows.length+' ngày'}),
    kpi({ic:'target',color:'bg-green',label:'CPL tốt nhất',val:bestCpl?vndC(bestCpl.cpl):'—',foot:bestCpl?dmy(parseDate(bestCpl.day)):'—'}),
    kpi({ic:'trend',color:'bg-red',label:'CPL cao nhất',val:worstCpl?vndC(worstCpl.cpl):'—',foot:worstCpl?dmy(parseDate(worstCpl.day)):'—'}),
    kpi({ic:'list',color:'bg-orange',label:'Ngày tốn phí · 0 tin nhắn',val:nf(noMsg.length),foot:'cần rà soát'})
  ].join('');
  const tRows=rows.map(r=>{const d=parseDate(r.day);let fl;
    if(r.spend>0&&r.msg===0)fl=tag('⚠ 0 tin nhắn','tag-bad');
    else if(r.msg&&r.cpl<=(s.cpl||1e18)*0.8)fl=tag('★ CPL tốt','tag-good');
    else if(r.ctr<0.5&&r.impr>500)fl=tag('CTR thấp','tag-warn');
    else fl=tag('Ổn định','tag-mut');
    return [dmy(d),vndC(r.spend),numC(r.impr),pct(r.ctr,2),r.linkclicks?vndC(r.cpc):'—',nf(r.msg),r.msg?vndC(r.cpl):'—',vndC(r.cpm),r.freq.toFixed(2),fl];});
  let html=highlight([
    {type:bestCpl?'ok':'info',icon:'list',html:`Kỳ <b>${P.label}</b>: chi <b>${vndC(s.spend)}</b> qua <b>${rows.length}</b> ngày.${bestCpl?` CPL tốt nhất <b>${vndC(bestCpl.cpl)}</b> (${dmy(parseDate(bestCpl.day))})`:''}${noMsg.length?` · <b>${noMsg.length}</b> ngày tốn phí không ra tin nhắn`:''}.`}
  ]);
  html+=`<div class="grid g-kpi" style="margin-bottom:18px">${kpis}</div>`;
  html+=card('Báo cáo chi tiết theo ngày',P.label,buildTable(
    ['Ngày','Chi tiêu','Hiển thị','CTR','CPC','Tin nhắn','CPL','CPM','Tần suất','Lưu ý'],tRows,860),`style="margin-bottom:18px"`);
  if(bestCpl)html+=ins('ok','trend',`Điểm sáng: <b>${dmy(parseDate(bestCpl.day))}</b> đạt CPL <b>${vndC(bestCpl.cpl)}</b>, thấp hơn mức trung bình kỳ (<b>${vndC(s.cpl)}</b>).`);
  if(noMsg.length)html+=ins('bad','info',`Có <b>${noMsg.length}</b> ngày tiêu tốn ngân sách nhưng không phát sinh tin nhắn (tổng <b>${vndC(noMsg.reduce((a,b)=>a+b.spend,0))}</b>). Nên tạm dừng hoặc tối ưu nhóm quảng cáo các ngày này.`);
  if(topReach)html+=ins('info','target',`Ngày phủ sóng rộng nhất: <b>${dmy(parseDate(topReach.day))}</b> tiếp cận <b>${numC(topReach.reach)}</b> người.`);
  setC(`<div>${html}</div>`);
}

/* ========== QC CHI TIẾT • TRANG 3: ĐỊNH DẠNG & MỤC TIÊU ========== */
function rAdpFormat(){
  const P=period();const arr=P.adsP;
  if(!arr.length){setC('<div class="card"><div class="empty-note">Không có dữ liệu quảng cáo trong '+P.label+'.</div></div>');return;}
  const hasThru=!!ADS_MAP.thruplay && arr.some(x=>x.thruplay>0);
  const tot=sumAds(arr);
  const types=uniq(arr.map(x=>x.type));
  const typeRows=types.map(t=>{const s=sumAds(arr.filter(x=>x.type===t));s.k=t;return s;}).sort((a,b)=>b.spend-a.spend);
  const goals=uniq(arr.map(x=>x.goal));
  const goalRows=goals.map(g=>{const s=sumAds(arr.filter(x=>x.goal===g));s.k=g;return s;}).sort((a,b)=>b.spend-a.spend);
  const posts=postsAgg(arr);
  const gn=g=>norm(g);
  // --- best posts: STRICT to each optimization goal, no cross-goal fallback ---
  // REPLIES: only posts whose goal = REPLIES & có tin nhắn; CPL thấp nhất, ưu tiên tin nhắn cao
  const repliesPosts=posts.filter(p=>gn(p.goal).includes('repl')&&p.msg>0);
  const bestReplies=repliesPosts.slice().sort((a,b)=>a.cpl-b.cpl||b.msg-a.msg)[0];
  // THRUPLAY: only posts whose goal = THRUPLAY; tỷ lệ xem cao nhất + lượt xem cao
  const thruPosts=posts.filter(p=>gn(p.goal).includes('thru'));
  const bestThru=thruPosts.slice().sort((a,b)=>div(b.thruplay,b.impr)-div(a.thruplay,a.impr)||b.thruplay-a.thruplay)[0];
  // POST ENGAGEMENT: only posts whose goal = POST_ENGAGEMENT; tỷ lệ tương tác cao & chi phí/tương tác thấp
  const engPosts=posts.filter(p=>gn(p.goal).includes('engage'));
  const bestEng=engPosts.slice().sort((a,b)=>b.engrate-a.engrate||div(a.spend,a.eng)-div(b.spend,b.eng))[0];

  const thruRate=bestThru&&bestThru.impr?pct(div(bestThru.thruplay,bestThru.impr)*100,1):'—';
  const cpe=bestEng&&bestEng.eng?vndC(div(bestEng.spend,bestEng.eng)):'—';

  const fmtType=(s,base)=>[esc(s.k),vndC(s.spend),pct(div(s.spend,base)*100),numC(s.impr),pct(s.ctr,2),nf(s.msg),s.msg?vndC(s.cpl):'—',pct(s.engrate)];
  const postCard=(title,color,ic,p,metricLabel,metricVal,sub)=>{
    if(!p)return card(title,sub||'',`<div class="empty-note" style="padding:18px">Chưa có dữ liệu phù hợp.</div>`);
    return card(title,sub||'',`<div class="bp">
      <div class="top"><div class="kicon ${color}" style="width:38px;height:38px">${svgIc(ic)}</div>
        <div><div class="big">${metricVal}</div><div class="bl">${metricLabel}</div></div></div>
      <div style="font-size:12px;color:var(--ink2);font-weight:600">${esc(p.goal)} · ${esc(p.type)}</div>
      <div class="meta">${tag('Chi '+vndC(p.spend),'tag-info')} ${tag(nf(p.msg)+' tin nhắn','tag-mut')} ${tag('CTR '+pct(p.ctr,2),'tag-mut')} ${tag('TT '+pct(p.engrate),'tag-mut')}</div>
      <a href="${esc(p.url)}" target="_blank" rel="noopener">${shortUrl(p.url)} ↗</a>
    </div>`);
  };
  let html=highlight([
    {type:'info',icon:'grid',html:`Kỳ <b>${P.label}</b>: <b>${types.length}</b> định dạng · <b>${goals.length}</b> mục tiêu · <b>${posts.length}</b> bài viết. Định dạng chi nhiều nhất: <b>${esc(typeRows[0]?.k||'—')}</b> (${pct(div(typeRows[0]?.spend||0,tot.spend)*100)} ngân sách).`}
  ]);
  html+=`<div class="grid g-3" style="margin-bottom:18px">
    ${postCard('🥇 Bài REPLIES tốt nhất','bg-green','trend',bestReplies,'CPL thấp nhất · '+(bestReplies?nf(bestReplies.msg)+' tin nhắn':''),bestReplies?vndC(bestReplies.cpl):'—','Chỉ bài mục tiêu REPLIES')}
    ${postCard('🎬 Bài THRUPLAY tốt nhất','bg-purple','chart',bestThru,'Tỷ lệ xem '+thruRate+(bestThru?' · '+numC(bestThru.thruplay)+' lượt xem':''),bestThru?thruRate:'—','Chỉ bài mục tiêu THRUPLAY')}
    ${postCard('💬 Bài POST ENGAGEMENT tốt nhất','bg-orange','doc',bestEng,'Tỷ lệ TT'+(bestEng?' · '+cpe+'/tương tác':''),bestEng?pct(bestEng.engrate):'—','Chỉ bài mục tiêu POST ENGAGEMENT')}
  </div>`;
  // share reports
  html+=`<div class="grid g-2" style="margin-bottom:18px">
    ${card('Tỷ trọng & hiệu suất theo định dạng','Cột "Tỷ trọng" = % ngân sách',buildTable(
      ['Định dạng','Chi tiêu','Tỷ trọng','Hiển thị','CTR','Tin nhắn','CPL','Tỷ lệ TT'],typeRows.map(s=>fmtType(s,tot.spend)),680))}
    ${card('Tỷ trọng & hiệu suất theo mục tiêu','Cột "Tỷ trọng" = % ngân sách',buildTable(
      ['Mục tiêu','Chi tiêu','Tỷ trọng','Hiển thị','CTR','Tin nhắn','CPL','Tỷ lệ TT'],goalRows.map(s=>fmtType(s,tot.spend)),680))}
  </div>`;
  // share donuts: spend by type & messages by type
  const msgByType=types.map(t=>sumAds(arr.filter(x=>x.type===t)).msg);
  html+=`<div class="grid g-2" style="margin-bottom:18px">
    ${card('Cơ cấu chi tiêu theo định dạng','% ngân sách',`<div class="split"><div class="chart-box h260"><canvas id="chFmtSpend"></canvas></div><div class="donut-legend">${donutLegend(types,typeRows.map(s=>s.spend),types.map((_,i)=>PAL[i%PAL.length]))}</div></div>`)}
    ${card('Cơ cấu tin nhắn theo định dạng','Định dạng nào tạo nhiều tin nhắn nhất',`<div class="split"><div class="chart-box h260"><canvas id="chFmtMsg"></canvas></div><div class="donut-legend">${donutLegend(types,msgByType,types.map((_,i)=>PAL[(i+2)%PAL.length]))}</div></div>`)}
  </div>`;
  // CPL by type/goal ranking
  const cplType=typeRows.filter(s=>s.msg>0).sort((a,b)=>a.cpl-b.cpl);
  html+=card('Xếp hạng CPL theo định dạng','Định dạng tối ưu chi phí tin nhắn nhất',
    cplType.length?`<div style="margin-top:6px">${cplType.map(s=>{const max=Math.max(...cplType.map(x=>x.cpl));return `<div class="prow"><div class="pl"><span>${esc(s.k)}</span><span class="pv">${vndC(s.cpl)} · ${nf(s.msg)} tin nhắn</span></div><div class="pbar"><i style="width:${Math.max(div(s.cpl,max)*100,6)}%;background:linear-gradient(90deg,var(--good),var(--accent))"></i></div></div>`;}).join('')}</div>`:'<div class="empty-note">Chưa có tin nhắn để tính CPL theo định dạng.</div>');
  if(!hasThru)html+=ins('warn','info','Không tìm thấy cột <b>lượt xem video / ThruPlay</b> (hoặc toàn bộ = 0) trong file Ads, nên "bài THRUPLAY tốt nhất" đang xếp theo lượt hiển thị của video. Nếu sheet có cột lượt xem, báo lại tên cột để xếp hạng chính xác.');
  setC(`<div>${html}</div>`);
  donut('chFmtSpend',typeRows.map(s=>s.spend),types.map((_,i)=>PAL[i%PAL.length]));
  donut('chFmtMsg',msgByType,types.map((_,i)=>PAL[(i+2)%PAL.length]));
}

/* ========== QC CHI TIẾT • TRANG 4: CHI TIẾT TỪNG BÀI VIẾT ========== */
function togglePost(id){
  const det=document.getElementById('det-'+id),row=document.getElementById('row-'+id);
  if(!det)return;const open=det.classList.toggle('show');if(row)row.classList.toggle('open',open);
}
function rAdpPosts(){
  const P=period();const posts=postsAgg(P.adsP).sort((a,b)=>b.spend-a.spend);
  if(!posts.length){setC('<div class="card"><div class="empty-note">Không có dữ liệu quảng cáo trong '+P.label+'.</div></div>');return;}
  const s=sumAds(P.adsP);
  const prevPosts={};postsAgg(P.adsPrev).forEach(p=>prevPosts[p.url]=p);
  const noMsg=posts.filter(p=>p.spend>0&&p.msg===0);
  // per-post daily rows (within current period)
  const dayByUrl={};P.adsP.forEach(r=>{const u=r.url||'(không rõ link)';(dayByUrl[u]=dayByUrl[u]||{});const k=ymd(r.date);(dayByUrl[u][k]=dayByUrl[u][k]||[]).push(r);});

  let html=highlight([
    {type:'info',icon:'doc',html:`Kỳ <b>${P.label}</b>: <b>${nf(posts.length)}</b> bài chạy QC · chi TB <b>${vndC(div(s.spend,posts.length))}</b>/bài · CPL toàn kỳ <b>${s.msg?vndC(s.cpl):'—'}</b>.${noMsg.length?` <b>${noMsg.length}</b> bài tốn phí chưa ra tin nhắn.`:''} Nhấn vào dòng để xem chi tiết theo ngày.`}
  ]);
  html+=`<div class="grid g-kpi" style="margin-bottom:18px">
    ${kpi({ic:'doc',color:'bg-blue',label:'Số bài viết chạy QC',val:nf(posts.length),foot:P.label})}
    ${kpi({ic:'wallet',color:'bg-purple',label:'Chi TB / bài',val:vndC(div(s.spend,posts.length)),foot:'tổng '+vndC(s.spend)})}
    ${kpi({ic:'target',color:'bg-green',label:'CPL toàn kỳ',val:s.msg?vndC(s.cpl):'—',foot:nf(s.msg)+' tin nhắn'})}
    ${kpi({ic:'list',color:'bg-red',label:'Bài tốn phí · 0 tin nhắn',val:nf(noMsg.length),foot:'cần xử lý'})}
  </div>`;
  // custom expandable table
  const head=['','Bài viết','Định dạng','Chi tiêu','Tin nhắn','CPL','CPL vs kỳ trước','CTR','Tỷ lệ TT','Lưu ý'];
  let rowsHtml='';
  posts.forEach((p,idx)=>{
    const pv=prevPosts[p.url];
    let momCell='—';
    if(pv&&pv.msg>0&&p.msg>0){const t=trendArrow(pv.cpl,p.cpl);momCell=tag((p.cpl<=pv.cpl?'▼ ':'▲ ')+vndC(Math.abs(p.cpl-pv.cpl)),p.cpl<=pv.cpl?'tag-good':'tag-bad');}
    else if(!pv)momCell=tag('Mới','tag-info');
    let fl;
    if(p.spend>0&&p.msg===0)fl=tag('⚠ 0 tin nhắn','tag-bad');
    else if(p.msg&&p.cpl<=(s.cpl||1e18)*0.8)fl=tag('★ CPL tốt','tag-good');
    else if(p.ctr<0.5&&p.impr>1000)fl=tag('CTR thấp','tag-warn');
    else fl=tag('Ổn định','tag-mut');
    rowsHtml+=`<tr class="exp-row" id="row-${idx}" onclick="togglePost(${idx})">
      <td><span class="exp-caret">▸</span></td>
      <td><a href="${esc(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--accent);font-weight:700;text-decoration:none">${shortUrl(p.url)} ↗</a></td>
      <td>${esc(p.type)}</td><td>${vndC(p.spend)}</td><td>${nf(p.msg)}</td><td>${p.msg?vndC(p.cpl):'—'}</td>
      <td>${momCell}</td><td>${pct(p.ctr,2)}</td><td>${pct(p.engrate)}</td><td>${fl}</td></tr>`;
    // daily detail
    const dmap=dayByUrl[p.url]||{};const dks=Object.keys(dmap).sort();
    let dRows=dks.map(k=>{const ds=sumAds(dmap[k]);return `<tr><td>${dmy(parseDate(k))}</td><td>${vndC(ds.spend)}</td><td>${numC(ds.impr)}</td><td>${pct(ds.ctr,2)}</td><td>${nf(ds.msg)}</td><td>${ds.msg?vndC(ds.cpl):'—'}</td><td>${numC(ds.eng)}</td></tr>`;}).join('');
    rowsHtml+=`<tr class="exp-detail" id="det-${idx}"><td colspan="${head.length}"><div class="exp-inner">
      <div style="font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px">Chi tiết theo ngày · ${esc(p.goal)}${pv?` · Kỳ trước: chi ${vndC(pv.spend)}, ${nf(pv.msg)} tin nhắn, CPL ${pv.msg?vndC(pv.cpl):'—'}`:' · Không có dữ liệu kỳ trước'}</div>
      <table><thead><tr><th>Ngày</th><th>Chi tiêu</th><th>Hiển thị</th><th>CTR</th><th>Tin nhắn</th><th>CPL</th><th>Tương tác</th></tr></thead><tbody>${dRows||'<tr><td colspan="7" style="text-align:center;color:var(--muted)">—</td></tr>'}</tbody></table>
    </div></td></tr>`;
  });
  html+=card('Bóc tách hiệu suất từng bài viết','Gộp theo link bài (Creative Facebook URL) · so sánh CPL với '+P.prevLabel+' · nhấn dòng để mở/thu gọn chi tiết theo ngày',
    `<div class="tbl-wrap"><table style="min-width:1000px"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`);
  const top=posts.filter(p=>p.msg>0).sort((a,b)=>a.cpl-b.cpl)[0];
  if(top)html+=ins('ok','trend',`Bài hiệu quả nhất: <b>${shortUrl(top.url)}</b> — CPL <b>${vndC(top.cpl)}</b>, ${nf(top.msg)} tin nhắn từ ${vndC(top.spend)}.`);
  if(noMsg.length)html+=ins('bad','info',`Có <b>${noMsg.length}</b> bài tiêu tốn ngân sách (tổng <b>${vndC(noMsg.reduce((a,b)=>a+b.spend,0))}</b>) nhưng chưa ra tin nhắn.`);
  setC(`<div>${html}</div>`);
}

/* ========== ADMIN • LỊCH SỬ TRUY CẬP ========== */
function rAdminLog(){
  if(!CURRENT||CURRENT.role!=='Admin'){
    setC('<div class="card"><div class="empty-note">🔒 Trang này chỉ dành cho tài khoản Quản trị (Admin).</div></div>');return;}
  const log=getLog();
  let kpis=[
    kpi({ic:'shield',color:'bg-blue',label:'Tổng lượt đăng nhập (máy này)',val:nf(log.length),foot:'lưu trên trình duyệt hiện tại'}),
    kpi({ic:'target',color:'bg-purple',label:'Số người dùng',val:nf(uniq(log.map(x=>x.user)).length),foot:'tài khoản khác nhau'}),
    kpi({ic:'cal',color:'bg-green',label:'Lần gần nhất',val:log.length?dmy(new Date(log[log.length-1].t)):'—',foot:log.length?new Date(log[log.length-1].t).toLocaleTimeString('vi-VN'):''})
  ].join('');
  const tRows=log.slice().reverse().slice(0,400).map(e=>{const d=new Date(e.t);
    return [d.toLocaleString('vi-VN'),esc(e.user),e.role==='Admin'?tag('Admin','tag-info'):tag(esc(e.role),'tag-mut'),
      `<span style="font-size:11px;color:var(--muted)">${esc((e.ua||'').slice(0,60))}</span>`];});
  let html=highlight([{type:'info',icon:'shield',html:`Đã ghi nhận <b>${nf(log.length)}</b> lượt đăng nhập từ <b>${nf(uniq(log.map(x=>x.user)).length)}</b> tài khoản trên trình duyệt này.`}]);
  html+=`<div class="grid g-kpi" style="margin-bottom:18px">${kpis}</div>`;
  html+=card('Lịch sử đăng nhập','Bản ghi gần nhất hiển thị trước (tối đa 400 dòng)',buildTable(
    ['Thời gian','Tài khoản','Vai trò','Thiết bị / trình duyệt'],tRows.length?tRows:[['—','—','—','—']],560),`style="margin-bottom:18px"`);
  html+=ins('warn','shield','<b>Lưu ý kỹ thuật:</b> Nhật ký truy cập được lưu cục bộ trên <b>trình duyệt/thiết bị này</b> (localStorage) vì dashboard chạy hoàn toàn phía client, không có máy chủ. Do đó Admin chỉ thấy các lượt đăng nhập thực hiện trên cùng trình duyệt. Cơ chế mật khẩu (băm SHA-256) & mã hoá link là <b>che giấu phía client</b>, phù hợp hạn chế truy cập nội bộ chứ không thay thế bảo mật máy chủ.');
  setC(`<div>${html}</div>`);
}
