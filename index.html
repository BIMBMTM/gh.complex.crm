<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH.Complex • CRM & Ads Intelligence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
/* ============ GH.Complex · Modern SaaS UI ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f3f4fa; --card:#ffffff; --card2:#f7f8fc; --line:#e7e8f2; --line2:#eef0f7;
  --ink:#181b2e; --ink2:#3a3e57; --muted:#7c809c;
  --accent:#6156e8; --accent2:#8a7cf8; --accent-soft:#efedfd;
  --brand:#2c2a6b;
  --good:#16a34a; --good-bg:#e7f8ee; --bad:#e5484d; --bad-bg:#fdebec;
  --warn:#d97706; --warn-bg:#fdf3e0; --info:#0284c7; --info-bg:#e6f4fd;
  --pink:#db2777; --purple:#7c3aed; --teal:#0d9488; --orange:#ea580c;
  --side-bg:#0e1020; --side-ink:#9ba0bf; --side-act:#ffffff;
  --sh:0 1px 2px rgba(16,18,42,.05),0 4px 14px rgba(16,18,42,.05);
  --radius:16px; --font:'Inter','Be Vietnam Pro',system-ui,sans-serif;
}
body.dark{
  --bg:#0b0d13; --card:#12151d; --card2:#171b25; --line:#222735; --line2:#1c212d;
  --ink:#eceef8; --ink2:#c6cade; --muted:#878ca9;
  --accent:#7b7ff5; --accent2:#9d92fa; --accent-soft:#232249;
  --good:#3ddc84; --good-bg:rgba(61,220,132,.12); --bad:#ff6369; --bad-bg:rgba(255,99,105,.12);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12); --info:#38bdf8; --info-bg:rgba(56,189,248,.12);
  --pink:#f472b6; --purple:#a78bfa; --teal:#2dd4bf; --orange:#fb923c;
  --side-bg:#0b0d13; --side-ink:#8d92b3;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c9ccdf;border-radius:99px}
body.dark ::-webkit-scrollbar-thumb{background:#333a5c}
::-webkit-scrollbar-track{background:transparent}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;
  background:radial-gradient(900px 500px at 20% 10%,#1d1f45 0%,#101228 55%,#0a0c1c 100%)}
.login-card{width:min(400px,92vw);background:rgba(255,255,255,.045);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:40px 36px;text-align:center;color:#fff;
  box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo-wrap{display:flex;justify-content:center;margin-bottom:16px}
.login-card h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.login-card .sub{font-size:12.5px;color:#a7abce;margin:5px 0 26px;font-weight:500}
.fld{text-align:left;margin-bottom:14px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:#a7abce;margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);outline:none;
  font-family:var(--font);font-size:13.5px;color:#fff;background:rgba(255,255,255,.06);transition:.15s}
.fld input:focus{border-color:var(--accent2);background:rgba(255,255,255,.09)}
.fld input::placeholder{color:#6f7398}
.btn-login{width:100%;margin-top:8px;padding:13px;border:none;border-radius:12px;cursor:pointer;
  font-family:var(--font);font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#6156e8,#8a7cf8);box-shadow:0 10px 26px rgba(97,86,232,.4);transition:.18s}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(97,86,232,.5)}
.login-err{margin-top:14px;font-size:12.5px;color:#ff8f94;font-weight:600;min-height:18px}
.login-foot{margin-top:22px;font-size:11px;color:#62668c}

/* ============ LOADER ============ */
#loader{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  z-index:60;background:rgba(10,12,26,.55);backdrop-filter:blur(4px)}
#loader .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#8a7cf8;animation:sp 1s linear infinite}
#loader p{color:#e2e4f5;font-size:13px;font-weight:600}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ SHELL ============ */
#app{display:none}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:var(--side-bg);display:flex;flex-direction:column;
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow:hidden;transition:width .22s ease,flex-basis .22s ease;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px}
.brand svg{border-radius:12px}
.brand .name{color:#fff;font-weight:800;font-size:15.5px;letter-spacing:-.2px;line-height:1.15;display:flex;flex-direction:column}
.brand .name small{font-size:8.5px;font-weight:600;color:#767b9e;letter-spacing:1.6px;margin-top:3px}
.nav-group{font-size:10px;font-weight:700;color:#5b6083;letter-spacing:1.4px;text-transform:uppercase;margin:16px 10px 8px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10.5px 12px;margin-bottom:3px;border:none;border-radius:11px;
  background:transparent;color:var(--side-ink);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:.15s}
.nav-item .ic{display:grid;place-items:center;flex:0 0 20px}
.nav-item .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{color:#dfe1f2;background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff;background:linear-gradient(135deg,#6156e8,#8a7cf8);box-shadow:0 8px 20px rgba(97,86,232,.35)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.user-chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:10px}
.user-chip .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6156e8,#8a7cf8);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 34px;text-transform:uppercase}
.user-chip .who{color:#e6e8f6;font-size:12.5px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;overflow:hidden}
.user-chip .who small{font-size:10px;color:#767b9e;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-logout{width:100%;padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:transparent;
  color:#a7abce;font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn-logout:hover{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.neu-soft{}
/* collapsed */
.side .lbl{white-space:nowrap;overflow:hidden}
.side.collapsed{width:78px;flex-basis:78px;padding-left:12px;padding-right:12px}
.side.collapsed .brand .name,.side.collapsed .nav-group,.side.collapsed .lbl,.side.collapsed .user-chip .who,.side.collapsed .btn-logout{display:none}
.side.collapsed .nav-item{justify-content:center}
.side.collapsed .brand,.side.collapsed .user-chip{justify-content:center}

/* ============ MAIN / TOPBAR ============ */
.main{flex:1;min-width:0;padding:22px 26px 40px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-title h2{font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.page-title p{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
.menu-btn{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;place-items:center;color:var(--ink2);font-size:16px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  display:grid;place-items:center;color:var(--ink2);box-shadow:var(--sh);transition:.15s;flex:0 0 auto}
.icon-btn:hover{color:var(--accent);border-color:var(--accent2)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ============ FILTER BAR ============ */
.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.pill-toggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--sh)}
.pill-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;
  font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s}
.pill-toggle button.active{background:linear-gradient(135deg,#6156e8,#8a7cf8);color:#fff;box-shadow:0 4px 12px rgba(97,86,232,.35)}
.sel{appearance:none;-webkit-appearance:none;padding:9px 30px 9px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%237c809c" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>') no-repeat right 12px center;
  font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;box-shadow:var(--sh);outline:none}
.date-inp{border:1px solid var(--line);outline:none;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--ink2);
  padding:9px 11px;border-radius:11px;background:var(--card);box-shadow:var(--sh);color-scheme:light}
body.dark .date-inp{color-scheme:dark}
.date-sep{font-size:12px;color:var(--muted);font-weight:700}
.btn-load{border:none;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:700;color:#fff;padding:10px 16px;border-radius:11px;
  background:linear-gradient(135deg,#6156e8,#8a7cf8);box-shadow:0 6px 16px rgba(97,86,232,.35);transition:.16s;display:inline-flex;align-items:center;gap:7px}
.btn-load:hover{transform:translateY(-1px)}
.btn-load:disabled{opacity:.6;cursor:default;transform:none}
.btn-load svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.data-stamp{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;width:100%;justify-content:flex-end}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
/* multiselect */
.ms{position:relative}
.ms-trigger{padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--ink2);box-shadow:var(--sh)}
.ms-trigger .cnt{color:var(--accent);margin-left:3px}
.ms-panel{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:230px;max-height:290px;overflow:auto;z-index:30;
  background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 40px rgba(16,18,42,.16);padding:8px}
.ms-panel.open{display:block}
.ms-actions{display:flex;gap:6px;margin-bottom:6px}
.ms-actions button{flex:1;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card2);cursor:pointer;
  font-family:var(--font);font-size:11px;font-weight:700;color:var(--ink2)}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.ms-opt:hover{background:var(--card2)}
.ms-opt input{accent-color:var(--accent)}

/* metric chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);cursor:pointer;font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--muted);
  padding:6px 12px;border-radius:999px;background:var(--card);transition:.14s}
.chip:hover{border-color:var(--accent2);color:var(--accent)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#6156e8,#8a7cf8);box-shadow:0 4px 10px rgba(97,86,232,.3)}

/* ============ GRID & CARDS ============ */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{padding:20px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.card h3{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.2px;margin-bottom:2px}
.card .csub{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-head h3{margin:0}

/* KPI */
.kpi{padding:18px 20px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:.18s;
  display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-content:start}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,18,42,.09)}
.kpi .kicon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;grid-row:1/3;align-self:start}
.kpi .kicon svg{width:21px;height:21px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kpi .klabel{grid-column:2;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .kval{grid-column:2;font-size:24px;font-weight:800;letter-spacing:-.7px;margin-top:1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kfoot{grid-column:1/3;display:flex;align-items:center;gap:6px;margin-top:11px;font-size:11.5px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800}
.trend.up{color:var(--good)}
.trend.down{color:var(--bad)}
.trend.flat{color:var(--muted)}
/* ===== BẢN TỐI: thẻ KPI gradient màu như ảnh Auto Ads Facebook ===== */
body.dark .kpi{border-color:rgba(255,255,255,.07)}
body.dark .kpi .kicon{background:rgba(255,255,255,.14) !important;color:#fff !important}
body.dark .kpi .kval{color:#fff}
body.dark .kpi .klabel{color:rgba(255,255,255,.72)}
body.dark .kpi .kfoot{color:rgba(255,255,255,.55)}
body.dark .kpi .trend.up{color:#4ade80}
body.dark .kpi .trend.down{color:#fb7185}
body.dark .kpi:has(.bg-blue){background:linear-gradient(160deg,#123163 0%,#0b1a36 70%)}
body.dark .kpi:has(.bg-green){background:linear-gradient(160deg,#0d4030 0%,#08201a 70%)}
body.dark .kpi:has(.bg-purple){background:linear-gradient(160deg,#33206b 0%,#181038 70%)}
body.dark .kpi:has(.bg-orange){background:linear-gradient(160deg,#553112 0%,#241505 70%)}
body.dark .kpi:has(.bg-pink){background:linear-gradient(160deg,#521a3a 0%,#260b1a 70%)}
body.dark .kpi:has(.bg-teal){background:linear-gradient(160deg,#0e4444 0%,#082222 70%)}
body.dark .kpi:has(.bg-red){background:linear-gradient(160deg,#54191d 0%,#260b0d 70%)}
body.dark .kpi:has(.bg-info){background:linear-gradient(160deg,#0e3d55 0%,#081e2b 70%)}
/* icon tints */
.bg-blue{background:var(--accent-soft);color:var(--accent)} .bg-pink{background:rgba(219,39,119,.1);color:var(--pink)}
.bg-purple{background:rgba(124,58,237,.1);color:var(--purple)} .bg-teal{background:rgba(13,148,136,.1);color:var(--teal)}
.bg-orange{background:rgba(234,88,12,.1);color:var(--orange)} .bg-green{background:var(--good-bg);color:var(--good)}
.bg-red{background:var(--bad-bg);color:var(--bad)} .bg-info{background:var(--info-bg);color:var(--info)}
.bg-slate{background:var(--line2);color:var(--ink2)}
body.dark .bg-blue{background:rgba(123,127,245,.15)} body.dark .bg-pink{background:rgba(244,114,182,.14)}
body.dark .bg-purple{background:rgba(167,139,250,.14)} body.dark .bg-teal{background:rgba(45,212,191,.13)}
body.dark .bg-orange{background:rgba(251,146,60,.13)} body.dark .bg-green{background:rgba(61,220,132,.13)}
body.dark .bg-red{background:rgba(255,99,105,.13)} body.dark .bg-info{background:rgba(56,189,248,.13)}

/* charts */
.chart-box{position:relative;width:100%}
.h220{height:220px}.h260{height:260px}.h300{height:300px}.h340{height:340px}
.donut-legend{display:flex;flex-direction:column;gap:9px;justify-content:center}
.lg-item{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.lg-dot{width:10px;height:10px;border-radius:3.5px;flex:0 0 10px}
.lg-item .v{margin-left:auto;color:var(--muted);font-weight:700}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center}
@media(max-width:560px){.split{grid-template-columns:1fr}}

/* progress */
.prow{margin-bottom:13px}
.prow .pl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.prow .pl .pv{color:var(--muted)}
.pbar{height:8px;border-radius:999px;background:var(--line2)}
.pbar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fn-row{display:flex;align-items:center;gap:12px}
.fn-bar{height:36px;border-radius:10px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:12.5px;min-width:70px;transition:width .8s ease;white-space:nowrap}
.fn-meta{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}

/* tables */
.tbl-wrap{overflow:auto;border-radius:13px;border:1px solid var(--line);max-height:560px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
thead th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
  text-align:right;padding:11px 12px;white-space:nowrap;z-index:2;border-bottom:1px solid var(--line)}
thead th:first-child,tbody td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
thead th:first-child{z-index:3;background:var(--card2)}
tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap;font-weight:600;color:var(--ink2)}
tbody tr:hover td{background:var(--card2)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.tag-good{background:var(--good-bg);color:var(--good)}.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-bad{background:var(--bad-bg);color:var(--bad)}.tag-info{background:var(--info-bg);color:var(--info)}
.tag-mut{background:var(--line2);color:var(--muted)}
.dl{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:800;margin-left:6px}
.dl.up{color:var(--good)}.dl.down{color:var(--bad)}.dl.flat{color:var(--muted)}

/* insights */
.insight{display:flex;gap:12px;padding:13px 15px;border-radius:13px;margin-bottom:10px;font-size:12.5px;font-weight:500;line-height:1.55;color:var(--ink2);border:1px solid var(--line)}
.insight .di{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center}
.insight .di svg{width:15px;height:15px;stroke-width:2;fill:none;stroke-linecap:round}
.insight.ok{background:var(--good-bg);border-color:transparent}.insight.ok .di{background:rgba(22,163,74,.16);color:var(--good)}
.insight.warn{background:var(--warn-bg);border-color:transparent}.insight.warn .di{background:rgba(217,119,6,.16);color:var(--warn)}

function parseDate(v){
  if(v==null)return null; if(v instanceof Date)return v;

  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    if(a>12)return new Date(y,b-1,a);

    return new Date(y,b-1,a);
  }
  const d=new Date(s);return isNaN(d)?null:d;
}

function uniq(a){return [...new Set(a)].filter(x=>x!=null&&x!=='');}
function initFilters(){
  const yrs=uniq([...LEADS.map(x=>x.y),...ADS.map(x=>x.y)]).sort((a,b)=>b-a);
  STATE.years=yrs.length?yrs:[new Date().getFullYear()];
  STATE.year=STATE.years[0];
  const mos=uniq([...LEADS,...ADS].filter(x=>x.y===STATE.year).map(x=>x.mo)).sort((a,b)=>b-a);
  STATE.month=mos.length?mos[0]:'all';
  // default range = the latest month's span
  if(STATE.month!=='all'){STATE.from=ymd(new Date(STATE.year,STATE.month,1));STATE.to=ymd(new Date(STATE.year,STATE.month+1,0));}
  else{STATE.from=ymd(new Date(STATE.year,0,1));STATE.to=ymd(new Date(STATE.year,11,31));}
  STATE.adGoal=uniq(ADS.map(x=>x.goal));
  STATE.adDelivery=uniq(ADS.map(x=>x.delivery));
  STATE.adType=uniq(ADS.map(x=>x.type));
  renderFilters();
}

/* ===================== PERIOD SLICING ===================== */
function leadsY(){return LEADS.filter(x=>x.y===STATE.year);}
function adsAll(){return ADS.filter(x=>STATE.adGoal.includes(x.goal)&&STATE.adDelivery.includes(x.delivery)&&STATE.adType.includes(x.type));}
function inPeriod(x,y,m){return x.y===y&&(m==='all'||x.mo===m);}
function dOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,d.getDate());}
function inRange(dt,a,b){const t=dOnly(dt).getTime();return t>=a.getTime()&&t<=b.getTime();}
function eachDay(a,b){const out=[];let d=new Date(a);while(d<=b){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}return out;}

function period(){
  if(STATE.mode==='range'&&STATE.from&&STATE.to){
    let a=dOnly(parseDate(STATE.from)),b=dOnly(parseDate(STATE.to));
    if(a>b){const t=a;a=b;b=t;}
    // MoM previous = same span shifted back one month
    const pa=dOnly(addMonths(a,-1)),pb=dOnly(addMonths(b,-1));
    const AD=adsAll();
    const fmt=d=>dmy(d);
    return {mode:'range',isMonth:false,from:a,to:b,pfrom:pa,pto:pb,
      leadsP:LEADS.filter(x=>inRange(x.date,a,b)),
      adsP:AD.filter(x=>inRange(x.date,a,b)),
      leadsPrev:LEADS.filter(x=>inRange(x.date,pa,pb)),
      adsPrev:AD.filter(x=>inRange(x.date,pa,pb)),
      days:eachDay(a,b),
      label:fmt(a)+' – '+fmt(b),prevLabel:fmt(pa)+' – '+fmt(pb),
      y:a.getFullYear(),m:a.getMonth()};
  }
  const m=STATE.month,y=STATE.year;const isMonth=m!=='all';
  let pm=m,py=y;if(isMonth){pm=m-1;if(pm<0){pm=11;py=y-1;}}else{py=y-1;}
  const AD=adsAll();
  return {mode:'month',y,m,isMonth,py,pm,
    leadsP:LEADS.filter(x=>inPeriod(x,y,m)),
    adsP:AD.filter(x=>inPeriod(x,y,m)),
    leadsPrev:LEADS.filter(x=>inPeriod(x,py,isMonth?pm:'all')),
    adsPrev:AD.filter(x=>inPeriod(x,py,isMonth?pm:'all')),
    label:isMonth?('Tháng '+(m+1)+'/'+y):('Năm '+y),
    prevLabel:isMonth?('Tháng '+(pm+1)+'/'+py):('Năm '+py)};
}
// generic day/month series over a period for ANY field, returns {lab,val,labFull(dates)}
function seriesOf(arr,P,field,fn){
  if(P.mode==='range'){const days=P.days;const m=leadsOrAdsByDay(arr);
    return {lab:days.map(d=>d.getDate()+'/'+(d.getMonth()+1)),val:days.map(d=>agg(m[ymd(d)]||[],field,fn)),dates:days};}
  if(P.isMonth){const dim=new Date(P.y,P.m+1,0).getDate();const days=Array.from({length:dim},(_,i)=>new Date(P.y,P.m,i+1));
    const m=leadsOrAdsByDay(arr);return {lab:days.map(d=>d.getDate()),val:days.map(d=>agg(m[ymd(d)]||[],field,fn)),dates:days};}
  return {lab:MONTHS,val:MONTHS.map((_,i)=>agg(arr.filter(x=>x.mo===i),field,fn)),dates:null};
}
function leadsOrAdsByDay(arr){const m={};arr.forEach(r=>{const k=ymd(r.date);(m[k]=m[k]||[]).push(r);});return m;}
function agg(rows,field,fn){if(fn)return fn(rows);return rows.reduce((a,b)=>a+(+b[field]||0),0);}

/* ===================== AGGREGATIONS ===================== */
function sumAds(arr){const k=['spend','reach','impr','eng','comments','msg','clicks','linkclicks','newmsg','thruplay'];const o={};k.forEach(x=>o[x]=0);arr.forEach(r=>k.forEach(x=>o[x]+=r[x]));
  o.cpm=div(o.spend,o.impr)*1000;o.cpc=div(o.spend,o.linkclicks);o.ctr=div(o.linkclicks,o.impr)*100;
  o.freq=div(o.impr,o.reach);o.cpl=div(o.spend,o.msg);o.cpnewmsg=div(o.spend,o.newmsg);o.engrate=div(o.eng,o.reach)*100;return o;}
function countBy(arr,fn){const m={};arr.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+1;});return m;}
function sumBy(arr,fn,val){const m={};arr.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+(val?val(x):1);});return m;}
function bookedCount(arr){return arr.filter(x=>x.sk==='booked').length;}
function trendArrow(cur,prev){const d=div(cur-prev,Math.abs(prev||1))*100;if(prev===0&&cur===0)return{cls:'flat',t:'0%'};if(prev===0)return{cls:'up',t:'mới'};return {cls:d>0.5?'up':d<-0.5?'down':'flat',t:(d>0?'▲':d<0?'▼':'')+pct(Math.abs(d))};}

/* ===================== UI BUILDERS ===================== */
function kpi(o){const tr=o.trend?`<span class="trend ${o.trend.cls}">${o.trend.t}</span>`:'';
  return `<div class="kpi"><div class="kicon ${o.color}">${svgIc(o.ic)}</div><div class="klabel">${o.label}</div><div class="kval">${o.val}</div><div class="kfoot">${tr}<span style="color:var(--muted)">${o.foot||''}</span></div></div>`;}
function card(title,sub,body,extra){return `<div class="card" ${extra||''}><div class="card-head"><div><h3>${title}</h3>${sub?`<div class="csub">${sub}</div>`:''}</div></div>${body}</div>`;}
function donutLegend(labels,vals,colors){const tot=vals.reduce((a,b)=>a+b,0);return labels.map((l,i)=>`<div class="lg-item"><span class="lg-dot" style="background:${colors[i]}"></span>${esc(l)}<span class="v">${nf(vals[i])} • ${pct(div(vals[i],tot)*100)}</span></div>`).join('');}
function ins(type,icon,html){return `<div class="insight ${type}"><div class="di">${svgIc(icon)}</div><div>${html}</div></div>`;}

/* ========== BIZ • TRANG 1: TỔNG QUAN ========== */
function rBizOverview(){
  const P=period();const lp=P.leadsP,lprev=P.leadsPrev;
  const tot=lp.length,bk=bookedCount(lp),totPrev=lprev.length,bkPrev=bookedCount(lprev);
  const unq=lp.filter(x=>x.sk==='unqualified').length, rej=lp.filter(x=>x.sk==='rejected').length;
  const unqPrev=lprev.filter(x=>x.sk==='unqualified').length;
  const qualRate=div(tot-unq,tot)*100, qualRatePrev=div(totPrev-unqPrev,totPrev)*100;
  const closeRate=div(bk,tot)*100, closeRatePrev=div(bkPrev,totPrev)*100;
  const active=lp.filter(x=>['new','consult','sitecheck','negotiate'].includes(x.sk)).length;
  const activePrev=lprev.filter(x=>['new','consult','sitecheck','negotiate'].includes(x.sk)).length;
  const ap=sumAds(P.adsP),apv=sumAds(P.adsPrev);
  const hasVal=LEADS.some(x=>x.value>0);
  const rev=lp.filter(x=>x.sk==='booked').reduce((a,b)=>a+b.value,0);
  const revPrev=lprev.filter(x=>x.sk==='booked').reduce((a,b)=>a+b.value,0);

  let kpis=[
    kpi({ic:'target',color:'bg-blue',label:'Tổng Lead',val:nf(tot),trend:trendArrow(tot,totPrev),foot:P.prevLabel+': '+nf(totPrev)}),
    kpi({ic:'chart',color:'bg-green',label:'Booking 🥂',val:nf(bk),trend:trendArrow(bk,bkPrev),foot:P.prevLabel+': '+nf(bkPrev)}),
    kpi({ic:'trend',color:'bg-purple',label:'Tỷ lệ chốt',val:pct(closeRate),trend:trendArrow(closeRate,closeRatePrev),foot:P.prevLabel+': '+pct(closeRatePrev)}),
    kpi({ic:'shield',color:'bg-teal',label:'Chất lượng lead',val:pct(qualRate),trend:trendArrow(qualRate,qualRatePrev),foot:nf(unq)+' lead unqualified'}),
    kpi({ic:'list',color:'bg-orange',label:'Đang trong pipeline',val:nf(active),trend:trendArrow(active,activePrev),foot:'lead đang tư vấn/thương thảo'}),
    kpi({ic:'wallet',color:'bg-pink',label:'Chi phí QC',val:vndC(ap.spend),trend:trendArrow(apv.spend,ap.spend),foot:'CPL '+(ap.msg?vndC(ap.cpl):'—')}),
    hasVal?kpi({ic:'doc',color:'bg-info',label:'Doanh thu booked (ước tính)',val:vndC(rev),trend:trendArrow(rev,revPrev),foot:P.prevLabel+': '+vndC(revPrev)}):null,
    kpi({ic:'cal',color:'bg-info',label:'Chi phí / booking',val:bk?vndC(div(ap.spend,bk)):'—',trend:bk&&bkPrev?trendArrow(div(apv.spend,bkPrev),div(ap.spend,bk)):null,foot:'blended'})
  ].filter(Boolean).join('');

  // highlight
  const tA=trendArrow(tot,totPrev),bA=trendArrow(bk,bkPrev);
  const hi=highlight([
    {type:bk>=bkPrev?'ok':'warn',icon:bk>=bkPrev?'trend':'info',html:`Kỳ <b>${P.label}</b>: <b>${nf(tot)}</b> lead (${tA.t} so với kỳ trước), chốt <b>${nf(bk)}</b> booking (${bA.t}), tỷ lệ chốt <b>${pct(closeRate)}</b>.`},
    {type:ap.msg&&ap.cpl<=(apv.cpl||1e18)?'ok':'info',icon:'wallet',html:`Chi quảng cáo <b>${vndC(ap.spend)}</b>, tạo <b>${nf(ap.msg)}</b> tin nhắn · CPL <b>${ap.msg?vndC(ap.cpl):'—'}</b>${apv.msg?` (kỳ trước ${vndC(apv.cpl)})`:''}.`}
  ]);

  // month comparison (selectable metric)
  const cmpMetric=STATE.cmpMetric||'leadbook';

/* ========== BIZ • TRANG 2: HIỆU SUẤT THEO NGÀY ========== */
function rBizDaily(){
  const P=period();
  let days;
  if(P.mode==='range')days=P.days;
  else if(P.isMonth){const dim=new Date(P.y,P.m+1,0).getDate();days=Array.from({length:dim},(_,i)=>new Date(P.y,P.m,i+1));}
  else{setC(`<div class="card"><div class="empty-note">Chọn <b>một tháng cụ thể</b> hoặc chuyển sang <b>Khoảng ngày</b> để xem bảng chi tiết theo ngày.</div></div>`);return;}
  const adMap=adsByDayMap(P.adsP),ldMap=leadDayRows(P.leadsP);
  const rows=[];let tL=0,tB=0,tS=0,tM=0;
  days.forEach(dt=>{
    const key=ymd(dt);
    const ld=ldMap[key]||[];const ad=adMap[key]||[];const s=sumAds(ad);
    const leads=ld.length,bk=ld.filter(x=>x.sk==='booked').length;
    tL+=leads;tB+=bk;tS+=s.spend;tM+=s.msg;
    let flag=tag('Bình thường','tag-mut');
    if(s.spend>0&&s.msg===0)flag=tag('⚠ Tốn phí · 0 tin nhắn','tag-bad');
    else if(s.spend>0&&leads===0)flag=tag('⚠ Có phí · 0 lead','tag-warn');
    else if(bk>0)flag=tag('★ Có booking','tag-good');
    else if(leads>0)flag=tag('Có lead','tag-info');
    if(leads===0&&s.spend===0)return;
    rows.push([dmy(dt),nf(leads),nf(bk),s.spend?vnd(s.spend):'—',nf(s.msg),s.msg?vnd(s.cpl):'—',leads?vndC(div(s.spend,leads)):'—',nf(s.reach),nf(s.impr),s.impr?pct(s.ctr):'—',flag]);
  });
  // MoM prev totals
  const sv=sumAds(P.adsPrev);const tLp=P.leadsPrev.length,tBp=bookedCount(P.leadsPrev);
  let html=`<div class="grid g-kpi" style="margin-bottom:18px">
    ${kpi({ic:'target',color:'bg-blue',label:'Tổng lead',val:nf(tL),trend:trendArrow(tL,tLp),foot:P.prevLabel+': '+nf(tLp)})}
    ${kpi({ic:'chart',color:'bg-green',label:'Booking',val:nf(tB),trend:trendArrow(tB,tBp),foot:P.prevLabel+': '+nf(tBp)})}
    ${kpi({ic:'wallet',color:'bg-pink',label:'Chi phí QC',val:vndC(tS),trend:trendArrow(sv.spend,tS),foot:P.prevLabel+': '+vndC(sv.spend)})}
    ${kpi({ic:'trend',color:'bg-purple',label:'Tin nhắn QC',val:nf(tM),trend:trendArrow(tM,sv.msg),foot:P.prevLabel+': '+nf(sv.msg)})}
    ${kpi({ic:'list',color:'bg-orange',label:'CPL blended',val:tM?vnd(tS/tM):'—',foot:'chi QC / tin nhắn'})}
    ${kpi({ic:'doc',color:'bg-teal',label:'Chi phí / booking',val:tB?vndC(tS/tB):'—',foot:'chi QC / booking'})}
  </div>`;
  html+=card('Bảng hiệu suất chi tiết theo ngày · '+P.label,'Kết hợp lead, booking & chỉ số quảng cáo (ghép theo ngày) · cột "Cảnh báo" nêu vấn đề của ngày',
    buildTable(['Ngày','Lead','Booked','Chi phí QC','Tin nhắn','CPL','Chi phí/Lead','Tiếp cận','Hiển thị','CTR','Cảnh báo'],rows,980));
  setC(html);

/* ========== BIZ • TRANG 3: LỊCH EVENT ========== */
function calGrid(y,m,evMap,labelFn){
  const first=new Date(y,m,1).getDay();const dim=new Date(y,m+1,0).getDate();
  const dows=['CN','T2','T3','T4','T5','T6','T7'];
  let cells='';for(let i=0;i<7;i++)cells+=`<div class="dow">${dows[i]}</div>`;
  for(let i=0;i<first;i++)cells+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){const ev=evMap[d]||[];
    let inner=`<div class="d">${d}</div>`;ev.slice(0,3).forEach((e,i)=>inner+=`<div class="ev" style="background:${PAL[i%PAL.length]}" title="${esc(labelFn(e))}">${esc(labelFn(e))}</div>`);
    if(ev.length>3)inner+=`<div style="font-size:9px;color:var(--muted);margin-top:2px">+${ev.length-3}</div>`;
    cells+=`<div class="cell${ev.length?' has':''}">${inner}</div>`;}
  return `<div class="cal">${cells}</div>`;
}

/* ========== BIZ • TRANG 4: DỰ BÁO ========== */
function rBizForecast(){
  const P=period();const lp=P.leadsP,ap=P.adsP;
  let y=P.y,m=P.isMonth?P.m:(P.mode==='range'?P.from.getMonth():new Date().getMonth());
  if(P.mode==='range')y=P.from.getFullYear();
  const dim=new Date(y,m+1,0).getDate();
  const today=new Date();const isCurrent=(y===today.getFullYear()&&m===today.getMonth());
  const elapsed=isCurrent?Math.max(today.getDate(),1):dim;
  const leadsSoFar=lp.length,bkSoFar=bookedCount(lp),spendSoFar=ap.reduce((a,b)=>a+b.spend,0),msgSoFar=ap.reduce((a,b)=>a+b.msg,0);
  // daily avg & weekly avg projections
  const dailyAvg=div(leadsSoFar,elapsed), weeklyAvg=dailyAvg*7;
  const projDaily=Math.round(dailyAvg*dim);
  const weeksInMonth=dim/7; const projWeekly=Math.round(weeklyAvg*weeksInMonth);
  const projLeads=Math.round((projDaily+projWeekly)/2); // blend of two methods
  const bkDailyAvg=div(bkSoFar,elapsed),spendDailyAvg=div(spendSoFar,elapsed);
  const projBk=Math.round(bkDailyAvg*dim),projSpend=spendDailyAvg*dim;
  const histClose=div(bookedCount(LEADS),LEADS.length);
  const pipeline=lp.filter(x=>['new','consult','sitecheck','negotiate'].includes(x.sk)).length;
  const expFromPipe=Math.round(pipeline*histClose);
  const prevBk=bookedCount(P.leadsPrev);

  // cumulative daily series (actual to date) + projection line
  const days=Array.from({length:dim},(_,i)=>i+1);
  const ldMap=leadDayRows(lp);
  let cum=0;const cumLeads=days.map(d=>{if(isCurrent&&d>elapsed)return null;cum+=(ldMap[ymd(new Date(y,m,d))]||[]).length;return cum;});
  // projection trajectory from run-rate (straight line to projLeads)
  const projLine=days.map(d=>Math.round(dailyAvg*d));

  let html=highlight([
    {type:projBk>=prevBk?'ok':'warn',icon:projBk>=prevBk?'trend':'info',html:`Dự báo cuối kỳ: <b>${nf(projLeads)}</b> lead · <b>${nf(projBk)}</b> booking · chi QC <b>${vndC(projSpend)}</b>. Hiện đạt ${nf(leadsSoFar)} lead sau ${elapsed}/${dim} ngày.`},
    {type:'info',icon:'target',html:`Trung bình <b>${dailyAvg.toFixed(1)}</b> lead/ngày · <b>${weeklyAvg.toFixed(0)}</b> lead/tuần. Pipeline mở <b>${nf(pipeline)}</b> lead → kỳ vọng thêm <b>+${nf(expFromPipe)}</b> booking (tỷ lệ chốt LS ${pct(histClose*100)}).`}
  ]);
  html+=`<div class="grid g-kpi" style="margin-bottom:18px">
    ${kpi({ic:'target',color:'bg-blue',label:'Lead dự báo cuối kỳ',val:nf(projLeads),foot:'TB ngày '+projDaily+' · TB tuần '+projWeekly})}
    ${kpi({ic:'chart',color:'bg-green',label:'Booking dự báo',val:nf(projBk),trend:trendArrow(projBk,prevBk),foot:'hiện tại '+nf(bkSoFar)})}
    ${kpi({ic:'wallet',color:'bg-pink',label:'Chi phí QC dự báo',val:vndC(projSpend),foot:'đã chi '+vndC(spendSoFar)})}
    ${kpi({ic:'trend',color:'bg-purple',label:'Booking kỳ vọng từ pipeline',val:'+'+nf(expFromPipe),foot:nf(pipeline)+' lead × '+pct(histClose*100)})}
  </div>`;
  html+=`<div class="grid g-2" style="margin-bottom:18px">
    ${card('Lũy kế lead theo ngày','Thực đạt (lũy kế) vs Quỹ đạo run-rate · '+lblFc(y,m),'<div class="chart-box h300"><canvas id="chCum"></canvas></div>')}
    ${card('Thực tế vs Dự báo','Đến nay vs cuối kỳ','<div class="chart-box h300"><canvas id="chFc"></canvas></div>')}
  </div>`;
  html+=card('Cơ sở & giả định dự báo','Phương pháp tính',
      ins('info','info',`<b>Trung bình ngày:</b> ${dailyAvg.toFixed(2)} lead/ngày × ${dim} ngày = ${projDaily} lead. <b>Trung bình tuần:</b> ${weeklyAvg.toFixed(1)} lead/tuần × ${weeksInMonth.toFixed(1)} tuần = ${projWeekly} lead. Dự báo cuối kỳ lấy trung bình hai phương pháp.`)+
      ins('info','target',`Tỷ lệ chốt lịch sử toàn dữ liệu <b>${pct(histClose*100)}</b> dùng để ước lượng booking từ pipeline đang mở.`)+
      ins('warn','info',`Dự báo mang tính tham khảo; độ chính xác tăng khi đã qua giữa kỳ.`));
  setC(html);
  mkChart('chCum',{type:'line',data:{labels:days,datasets:[
    {label:'Lũy kế thực đạt',data:cumLeads,borderColor:C.accent,borderWidth:2.8,tension:.3,pointRadius:0,fill:true,backgroundColor:c=>grad(c.chart.ctx,c.chart.chartArea,'rgba(63,61,153,.18)',C.accentFill0)},
    {label:'Quỹ đạo run-rate',data:projLine,borderColor:C.orange,borderWidth:2,borderDash:[5,4],tension:.1,pointRadius:0,fill:false}]},
    options:{plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,padding:14}},datalabels:DLA},scales:{y:{...AXIS,beginAtZero:true},x:AXISX}}});
  mkChart('chFc',{type:'bar',data:{labels:['Lead','Booking','Chi phí (tr₫)'],datasets:[
    {label:'Hiện tại',data:[leadsSoFar,bkSoFar,+(spendSoFar/1e6).toFixed(1)],backgroundColor:C.accentLt,borderRadius:7,maxBarThickness:46},
    {label:'Dự báo cuối kỳ',data:[projLeads,projBk,+(projSpend/1e6).toFixed(1)],backgroundColor:C.accent,borderRadius:7,maxBarThickness:46}]},
    options:{plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,padding:14}},datalabels:{display:true,anchor:'end',align:'end',font:{weight:'700',size:10},color:C.ink,formatter:v=>v||''}},scales:{y:{...AXIS,beginAtZero:true},x:AXISX}}});
}

/* ========== BIZ • NGUỒN LEAD & ROI ========== */
function rBizRoi(){
  const P=period();const lp=P.leadsP,ap=P.adsP;

  const spend=s.spend,leads=lp.length,bk=bookedCount(lp);
  const leadsPrev=P.leadsPrev.length,bkPrev=bookedCount(P.leadsPrev);

  const leadFromAdsShare=div(msg,leads)*100; // proxy share
  const src=uniq(lp.map(x=>x.source));

    ${card('Bảng hiệu quả nguồn lead','Chi tiết theo nguồn',buildTable(['Nguồn lead','Lead','Booking','Tỷ lệ chốt','Tỷ trọng lead'],

/* ===================== ADS HELPERS ===================== */
function adsSeries(arr,P,field){const s=seriesOf(arr,P,field);return {lab:s.lab,val:s.val};}
function adsDayRows(arr){const m=adsByDayMap(arr);return Object.keys(m).sort().map(k=>{const s=sumAds(m[k]);s.day=k;return s;});}
function postsAgg(arr){const m={};arr.forEach(r=>{const k=r.url||'(không rõ link)';(m[k]=m[k]||[]).push(r);});
  return Object.entries(m).map(([url,rows])=>{const s=sumAds(rows);s.url=url;s.type=rows[0].type;s.goal=rows[0].goal;s.delivery=rows[0].delivery;s.n=rows.length;return s;});}
function shortUrl(u){if(!u)return '—';const m=u.match(/(\d{5,})/g);return m?('…/'+m[m.length-1]):(u.length>42?u.slice(0,40)+'…':u);}
/* ===================== ADS · METRIC REGISTRY ===================== */
const ADS_M={
 spend:{l:'Đã chi',c:'#6156e8',ax:'yM',f:s=>s.spend,fmt:vndC},
 reach:{l:'Tổng tiếp cận',c:'#0ea5e9',ax:'yC',f:s=>s.reach,fmt:numC},
 msg:{l:'Người nhắn tin',c:'#16a34a',ax:'yC2',f:s=>s.msg,fmt:nf},
 comments:{l:'Bình luận',c:'#f59e0b',ax:'yC2',f:s=>s.comments,fmt:nf},
 cpm:{l:'CPM',c:'#7c3aed',ax:'yM',f:s=>s.cpm,fmt:vndC,inv:1},
 cpl:{l:'CP / người nhắn tin',c:'#e5484d',ax:'yM',f:s=>s.cpl,fmt:vndC,inv:1},
 ctr:{l:'CTR (%)',c:'#0d9488',ax:'yP',f:s=>s.ctr,fmt:v=>pct(v,2)},
};
function toggleOv(k){if(!STATE.ovSel)STATE.ovSel=['spend','msg'];
  const i=STATE.ovSel.indexOf(k);
  if(i>=0){if(STATE.ovSel.length>1)STATE.ovSel.splice(i,1);}else STATE.ovSel.push(k);
  render();}
function anchorYM(P){let y=P.y,m;
  if(P.mode==='range'){y=P.from.getFullYear();m=P.from.getMonth();}
  else if(P.isMonth)m=P.m;
  else{const mos=uniq(adsAll().filter(x=>x.y===y).map(x=>x.mo)).sort((a,b)=>b-a);m=mos.length?mos[0]:new Date().getMonth();}
  return {y,m};}
function ymAgo(y,m,n){let mm=m-n,yy=y;while(mm<0){mm+=12;yy--;}return {y:yy,m:mm};}
function adsMultiChart(id,labels,rowsPerLabel){
  const sel=STATE.ovSel;
  const ds=sel.map(k=>{const M=ADS_M[k];return {label:M.l,data:rowsPerLabel.map(rs=>+(M.f(sumAds(rs))||0)),
    borderColor:M.c,backgroundColor:M.c,tension:.38,borderWidth:2.4,pointRadius:0,pointHoverRadius:4,yAxisID:M.ax,datalabels:DLA};});
  mkChart(id,{type:'line',data:{labels,datasets:ds},options:{
    plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,padding:12}}},
    scales:{
      yC:{...AXIS,position:'left',display:'auto',beginAtZero:true,ticks:{...AXIS.ticks,callback:v=>numK(v)}},
      yC2:{position:'left',display:'auto',beginAtZero:true,grid:{display:false},border:{display:false},ticks:{padding:6}},
      yM:{position:'right',display:'auto',beginAtZero:true,grid:{display:false},border:{display:false},ticks:{padding:6,callback:v=>vndK(v)}},
      yP:{position:'right',display:'auto',beginAtZero:true,grid:{display:false},border:{display:false},ticks:{padding:6,callback:v=>v+'%'}},
      x:AXISX}}});
}
function deltaHtml(cur,prev,inv){
  if(!prev&&prev!==0)return '';
  if(!prev)return '';
  const d=(cur-prev)/prev*100;if(!isFinite(d))return '';
  const up=d>=0,good=inv?!up:up;
  const cls=Math.abs(d)<0.05?'flat':(good?'up':'down');
  return `<span class="dl ${cls}">${up?'▲':'▼'}${Math.abs(d).toFixed(1)}%</span>`;
}
function deltaTag(cur,prev,inv){
  if(!prev)return tag('—','tag-mut');
  const d=(cur-prev)/prev*100;if(!isFinite(d))return tag('—','tag-mut');
  const up=d>=0,good=inv?!up:up;
  if(Math.abs(d)<0.05)return tag('0%','tag-mut');
  return tag((up?'▲ ':'▼ ')+Math.abs(d).toFixed(1)+'%',good?'tag-good':'tag-bad');
}

/* ========== ADS • TRANG 1: TỔNG QUAN ========== */
function rAdsOverview(){
  const P=period();if(!STATE.ovSel)STATE.ovSel=['spend','msg'];
  const A=adsAll();
  if(!P.adsP.length&&!A.length){setC('<div class="card"><div class="empty-note">Không có dữ liệu quảng cáo.</div></div>');return;}
  const s=sumAds(P.adsP),sp=sumAds(P.adsPrev);
  const kp=(ic,color,key)=>{const M=ADS_M[key];const cur=M.f(s),prev=M.f(sp);
    return kpi({ic,color,label:M.l,val:M.fmt(cur),trend:M.inv?trendArrow(prev,cur):trendArrow(cur,prev),foot:P.prevLabel+': '+M.fmt(prev)});};
  let html=`<div class="grid g-kpi" style="margin-bottom:16px">
    ${kp('wallet','bg-blue','spend')}${kp('target','bg-teal','reach')}${kp('trend','bg-green','msg')}
    ${kp('doc','bg-orange','comments')}${kp('chart','bg-purple','cpm')}${kp('list','bg-red','cpl')}${kp('grid','bg-info','ctr')}
  </div>`;
  // metric chips (shared by both charts)
  const chips='<div class="chips" style="margin-bottom:14px">'+Object.entries(ADS_M).map(([k,M])=>
    `<button class="chip ${STATE.ovSel.includes(k)?'on':''}" onclick="toggleOv('${k}')">${M.l}</button>`).join('')+'</div>';
  html+=`<div class="card" style="padding:14px 20px;margin-bottom:16px"><div style="font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px">CHỌN CHỈ SỐ HIỂN THỊ TRÊN BIỂU ĐỒ (chọn được nhiều)</div>${chips.replace(' style="margin-bottom:14px"','')}</div>`;
  // two charts side by side
  const an=anchorYM(P);
  const moLabels=MONTHS,moRows=MONTHS.map((_,i)=>A.filter(x=>x.y===P.y&&x.mo===i));
  let dLabels,dRows;
  if(P.mode==='range'){const map=adsByDayMap(P.adsP);dLabels=P.days.map(d=>d.getDate()+'/'+(d.getMonth()+1));dRows=P.days.map(d=>map[ymd(d)]||[]);}
  else{const dim=new Date(an.y,an.m+1,0).getDate();const arr=A.filter(x=>x.y===an.y&&x.mo===an.m);const map=adsByDayMap(arr);
    dLabels=Array.from({length:dim},(_,i)=>i+1);dRows=dLabels.map(d=>map[ymd(new Date(an.y,an.m,d))]||[]);}
  const dTitle=P.mode==='range'?('Theo ngày · '+P.label):('Theo ngày · Tháng '+(an.m+1)+'/'+an.y);
  html+=`<div class="grid g-2" style="margin-bottom:16px">
    ${card('Diễn biến theo tháng · Năm '+P.y,'Các chỉ số đã chọn ở trên','<div class="chart-box h300"><canvas id="chOvMo"></canvas></div>')}
    ${card(dTitle,'Các chỉ số đã chọn ở trên','<div class="chart-box h300"><canvas id="chOvDay"></canvas></div>')}
  </div>`;
  // monthly summary table (latest first, current row with deltas)
  const monthsWith=uniq(A.filter(x=>x.y===P.y).map(x=>x.mo)).sort((a,b)=>b-a);
  const keys=Object.keys(ADS_M);
  const mRows=monthsWith.map((mo,idx)=>{
    const s0=sumAds(A.filter(x=>x.y===P.y&&x.mo===mo));
    const pv=ymAgo(P.y,mo,1);
    const s1=sumAds(A.filter(x=>x.y===pv.y&&x.mo===pv.m));
    const cells=keys.map(k=>{const M=ADS_M[k];let cell=M.fmt(M.f(s0));
      if(idx===0)cell+=deltaHtml(M.f(s0),M.f(s1),M.inv);
      return cell;});
    return [('Tháng '+(mo+1)+'/'+P.y)+(idx===0?' '+tag('Hiện tại','tag-info'):''),...cells];
  });
  // donuts
  const arrY=P.adsP;
  const ty=sumBy(arrY,x=>x.type,x=>x.spend);const tyL=Object.keys(ty).sort((a,b)=>ty[b]-ty[a]);
  const gl=sumBy(arrY,x=>x.goal,x=>x.spend);const glL=Object.keys(gl).sort((a,b)=>gl[b]-gl[a]);
  html+=`<div class="grid g-2" style="margin-bottom:16px">
    ${card('Tổng hợp chỉ số theo tháng · '+P.y,'Tháng gần nhất đứng đầu · hàng "Hiện tại" kèm so sánh với tháng trước',
      buildTable(['Tháng',...keys.map(k=>ADS_M[k].l)],mRows,860))}
    <div style="display:flex;flex-direction:column;gap:16px">
      ${card('Cơ cấu chi tiêu theo định dạng',P.label,`<div class="split"><div class="chart-box h220"><canvas id="chOvType"></canvas></div><div class="donut-legend">${donutLegend(tyL,tyL.map(k=>ty[k]),tyL.map((_,i)=>PAL[i%PAL.length]))}</div></div>`)}
      ${card('Cơ cấu chi tiêu theo mục tiêu',P.label,`<div class="split"><div class="chart-box h220"><canvas id="chOvGoal"></canvas></div><div class="donut-legend">${donutLegend(glL,glL.map(k=>gl[k]),glL.map((_,i)=>PAL[(i+2)%PAL.length]))}</div></div>`)}
    </div>
  </div>`;
  setC(html);
  adsMultiChart('chOvMo',moLabels,moRows);
  adsMultiChart('chOvDay',dLabels,dRows);
  donut('chOvType',tyL.map(k=>ty[k]),tyL.map((_,i)=>PAL[i%PAL.length]));
  donut('chOvGoal',glL.map(k=>gl[k]),glL.map((_,i)=>PAL[(i+2)%PAL.length]));
}

/* ========== ADS • TRANG 2: CHI TIẾT QUẢNG CÁO ========== */
function rAdsDetail(){
  const P=period();const A=adsAll();
  const an=anchorYM(P);
  const m0=an,m1=ymAgo(an.y,an.m,1),m2=ymAgo(an.y,an.m,2);
  const arr0=A.filter(x=>x.y===m0.y&&x.mo===m0.m),arr1=A.filter(x=>x.y===m1.y&&x.mo===m1.m),arr2=A.filter(x=>x.y===m2.y&&x.mo===m2.m);
  if(!arr0.length&&!arr1.length&&!arr2.length){setC('<div class="card"><div class="empty-note">Không có dữ liệu quảng cáo trong 3 tháng gần nhất.</div></div>');return;}
  const s0=sumAds(arr0),s1=sumAds(arr1),s2=sumAds(arr2);
  const L0='T'+(m0.m+1)+'/'+m0.y,L1='T'+(m1.m+1)+'/'+m1.y,L2='T'+(m2.m+1)+'/'+m2.y;
  // 1) 3-month comparison table
  const METRICS=[
    ['Đã chi',x=>x.spend,vndC,0],['Tổng tiếp cận',x=>x.reach,numC,0],['Hiển thị',x=>x.impr,numC,0],
    ['Người nhắn tin',x=>x.msg,nf,0],['Bình luận',x=>x.comments,nf,0],['Tương tác bài viết',x=>x.eng,numC,0],
    ['CPM',x=>x.cpm,vndC,1],['CP / người nhắn tin',x=>x.cpl,vndC,1],['CTR (%)',x=>x.ctr,v=>pct(v,2),0]
  ];
  const cmpRows=METRICS.map(([l,f,fmt,inv])=>[l,fmt(f(s0)),fmt(f(s1)),fmt(f(s2)),deltaTag(f(s0),f(s1),inv),deltaTag(f(s0),f(s2),inv)]);
  let html=card('Tổng quảng cáo · so sánh 3 tháng gần nhất','Tháng hiện tại vs 2 tháng liền kề',
    buildTable(['Chỉ số',L0+' (hiện tại)',L1,L2,'So với '+L1,'So với '+L2],cmpRows,720),'style="margin-bottom:16px"');
  // 2) daily detail table
  const dr=adsDayRows(arr0);
  const dRows=dr.map(r=>[dmy(parseDate(r.day)),vndC(r.spend),numC(r.reach),numC(r.impr),nf(r.msg),nf(r.comments),r.msg?vndC(r.cpl):'—',vndC(r.cpm),pct(r.ctr,2)]);
  html+=card('Chỉ số chi tiết từng ngày · '+L0,'Toàn bộ ngày có chạy quảng cáo trong tháng',
    buildTable(['Ngày','Đã chi','Tiếp cận','Hiển thị','Người nhắn tin','Bình luận','CP/người nhắn','CPM','CTR'],dRows,820),'style="margin-bottom:16px"');
  // ==> short good/bad assessment
  const goods=[],bads=[];
  const chk=(cur,prev,label,fmt,inv)=>{if(!prev)return;const d=(cur-prev)/prev*100;if(!isFinite(d)||Math.abs(d)<1)return;
    const better=inv?d<0:d>0;
    (better?goods:bads).push(`<b>${label}</b> ${d>0?'tăng':'giảm'} ${Math.abs(d).toFixed(1)}% (${fmt(prev)} → ${fmt(cur)})`);};
  chk(s0.msg,s1.msg,'Người nhắn tin',nf,0);chk(s0.cpl,s1.cpl,'CP/người nhắn tin',vndC,1);
  chk(s0.ctr,s1.ctr,'CTR',v=>pct(v,2),0);chk(s0.cpm,s1.cpm,'CPM',vndC,1);
  chk(s0.reach,s1.reach,'Tiếp cận',numC,0);chk(s0.comments,s1.comments,'Bình luận',nf,0);
  html+=`<div class="grid g-2" style="margin-bottom:16px">
    ${card('✅ Điểm tốt của '+L0,'So với '+L1,goods.length?goods.map(g=>ins('ok','trend',g)).join(''):'<div class="empty-note">Chưa có chỉ số nào cải thiện đáng kể.</div>')}
    ${card('⚠️ Điểm chưa tốt của '+L0,'So với '+L1,bads.length?bads.map(g=>ins('bad','info',g)).join(''):'<div class="empty-note">Không có chỉ số nào đi xuống đáng kể.</div>')}
  </div>`;
  // 3) per-goal impact
  const dim3=(a,b,c,fmt)=>`${fmt(a)} <span style="color:var(--muted)">/ ${fmt(b)} / ${fmt(c)}</span>`;
  const impactTag=(msg0,msg1,cpl0,cpl1)=>{
    if(msg0>msg1&&(!cpl1||cpl0<=cpl1*1.05))return tag('Tích cực','tag-good');
    if(msg0<msg1||(cpl1&&cpl0>cpl1*1.15))return tag('Kéo giảm','tag-bad');
    return tag('Ổn định','tag-mut');};
  const goalList=uniq([...arr0,...arr1,...arr2].map(x=>x.goal));
  const gRows=goalList.map(g=>{
    const g0=sumAds(arr0.filter(x=>x.goal===g)),g1=sumAds(arr1.filter(x=>x.goal===g)),g2=sumAds(arr2.filter(x=>x.goal===g));

    return {g,g0,g1,g2,dMsg,row:[esc(g),vndC(g0.spend),dim3(g0.msg,g1.msg,g2.msg,nf),dim3(g0.msg?g0.cpl:0,g1.msg?g1.cpl:0,g2.msg?g2.cpl:0,v=>v?vndC(v):'—'),

  }).sort((a,b)=>b.g0.spend-a.g0.spend);
  html+=card('Tác động theo mục tiêu quảng cáo','Cột gộp hiển thị: '+L0+' / '+L1+' / '+L2,
    buildTable(['Mục tiêu','Đã chi '+L0,'Người nhắn tin','CP/người nhắn','Tương tác','Δ vs '+L1,'Tác động'],gRows.map(r=>r.row),860),'style="margin-bottom:16px"');
  // 4) per-format impact
  const typeList=uniq([...arr0,...arr1,...arr2].map(x=>x.type));
  const tRows=typeList.map(t=>{
    const t0=sumAds(arr0.filter(x=>x.type===t)),t1=sumAds(arr1.filter(x=>x.type===t)),t2=sumAds(arr2.filter(x=>x.type===t));
    return {t,t0,row:[esc(t),vndC(t0.spend),dim3(t0.msg,t1.msg,t2.msg,nf),dim3(t0.msg?t0.cpl:0,t1.msg?t1.cpl:0,t2.msg?t2.cpl:0,v=>v?vndC(v):'—'),

  }).sort((a,b)=>b.t0.spend-a.t0.spend);
  html+=card('Tác động theo dạng nội dung (Video · Hình ảnh · Canvas)','Cột gộp hiển thị: '+L0+' / '+L1+' / '+L2,
    buildTable(['Dạng nội dung','Đã chi '+L0,'Người nhắn tin','CP/người nhắn','Tương tác','CTR','Tác động'],tRows.map(r=>r.row),860),'style="margin-bottom:16px"');
  // 5) posts by goal vs 2 months
  const p0=postsAgg(arr0),map1={},map2={};postsAgg(arr1).forEach(p=>map1[p.url]=p);postsAgg(arr2).forEach(p=>map2[p.url]=p);
  const byGoal={};p0.forEach(p=>{(byGoal[p.goal]=byGoal[p.goal]||[]).push(p);});
  let pRows=[];
  Object.keys(byGoal).sort().forEach(g=>{
    byGoal[g].sort((a,b)=>b.spend-a.spend).slice(0,5).forEach(p=>{
      const q1=map1[p.url]||{},q2=map2[p.url]||{};
      const trendT=(!q1.url)?tag('Bài mới','tag-info'):impactTag(p.msg,q1.msg||0,p.cpl,(q1.msg?q1.cpl:0));
      pRows.push([`<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:none">${shortUrl(p.url)} ↗</a>`,
        esc(g),esc(p.type),vndC(p.spend),dim3(p.msg,q1.msg||0,q2.msg||0,nf),
        dim3(p.msg?p.cpl:0,q1.msg?q1.cpl:0,q2.msg?q2.cpl:0,v=>v?vndC(v):'—'),
        dim3(p.eng,q1.eng||0,q2.eng||0,numC),trendT]);
    });
  });
  // contribution insight
  const topGoal=gRows.slice().sort((a,b)=>Math.abs(b.dMsg)-Math.abs(a.dMsg))[0];
  const totalD=s0.msg-s1.msg;
  let contrib='';
  if(topGoal&&totalD!==0){
    contrib=ins(totalD>=0?'ok':'warn','target',
      `Người nhắn tin ${L0} ${totalD>=0?'tăng':'giảm'} <b>${nf(Math.abs(totalD))}</b> so với ${L1}; nhóm mục tiêu <b>${esc(topGoal.g)}</b> tác động lớn nhất (${topGoal.dMsg>=0?'+':''}${nf(topGoal.dMsg)} người nhắn, CP/người nhắn ${topGoal.g1.msg?vndC(topGoal.g1.cpl):'—'} → ${topGoal.g0.msg?vndC(topGoal.g0.cpl):'—'}).`);
  }
  html+=card('Bài viết theo từng mục tiêu · biến động so với 2 tháng trước','Top 5 bài chi tiêu cao nhất mỗi mục tiêu · cột gộp: '+L0+' / '+L1+' / '+L2,
    buildTable(['Bài viết','Mục tiêu','Dạng nội dung','Đã chi '+L0,'Người nhắn tin','CP/người nhắn','Tương tác','Xu hướng'],pRows,980)+contrib);
  setC(html);
}

/* ========== ADS • TRANG 3: HIỆU SUẤT TỪNG BÀI VIẾT ========== */
function togglePost(id){
  const det=document.getElementById('det-'+id),row=document.getElementById('row-'+id);
  if(!det)return;const open=det.classList.toggle('show');if(row)row.classList.toggle('open',open);
}
function rAdsPosts(){
  const P=period();const posts=postsAgg(P.adsP).sort((a,b)=>b.spend-a.spend);
  if(!posts.length){setC('<div class="card"><div class="empty-note">Không có dữ liệu quảng cáo trong '+P.label+'.</div></div>');return;}
  const gn=g=>norm(g);
  // strict best posts
  const repliesBest=posts.filter(p=>gn(p.goal).includes('repl')&&p.msg>0).sort((a,b)=>a.cpl-b.cpl||b.msg-a.msg)[0];
  const engBest=posts.filter(p=>gn(p.goal).includes('engage')&&p.eng>0).sort((a,b)=>div(a.spend,a.eng)-div(b.spend,b.eng)||b.eng-a.eng)[0];
  const thruPosts=posts.filter(p=>gn(p.goal).includes('thru')||gn(p.goal).includes('play')||gn(p.goal).includes('video')||gn(p.goal).includes('view'));
  const thruHasViews=thruPosts.some(p=>p.thruplay>0);
  const thruBest=thruHasViews
    ? thruPosts.slice().sort((a,b)=>div(b.thruplay,b.impr)-div(a.thruplay,a.impr)||b.thruplay-a.thruplay)[0]
    : thruPosts.slice().sort((a,b)=>b.engrate-a.engrate||b.eng-a.eng)[0];
  const postCard=(title,color,ic,p,metricLabel,metricVal,sub)=>{
    if(!p)return card(title,sub||'',`<div class="empty-note" style="padding:16px">Chưa có dữ liệu phù hợp.</div>`);
    return card(title,sub||'',`<div class="bp">
      <div class="top"><div class="kicon ${color}" style="width:40px;height:40px">${svgIc(ic)}</div>
        <div><div class="big">${metricVal}</div><div class="bl">${metricLabel}</div></div></div>
      <div style="font-size:12px;color:var(--ink2);font-weight:600">${esc(p.goal)} · ${esc(p.type)}</div>
      <div class="meta">${tag('Chi '+vndC(p.spend),'tag-info')} ${tag(nf(p.msg)+' người nhắn','tag-mut')} ${tag(numC(p.eng)+' tương tác','tag-mut')} ${tag('CTR '+pct(p.ctr,2),'tag-mut')}</div>
      <a href="${esc(p.url)}" target="_blank" rel="noopener">${shortUrl(p.url)} ↗</a>
    </div>`);
  };
  const thruRate=thruBest&&thruBest.impr?pct(div(thruBest.thruplay,thruBest.impr)*100,1):'—';
  let html=`<div class="grid g-3" style="margin-bottom:16px">
    ${postCard('🥇 REPLIES · CP/người nhắn rẻ nhất','bg-green','trend',repliesBest,repliesBest?nf(repliesBest.msg)+' người nhắn tin':'',repliesBest?vndC(repliesBest.cpl):'—','Chỉ bài chạy mục tiêu REPLIES')}
    ${postCard('💬 POST ENGAGEMENT · CP/tương tác rẻ nhất','bg-orange','doc',engBest,engBest?numC(engBest.eng)+' tương tác':'',engBest?vndC(div(engBest.spend,engBest.eng)):'—','Chỉ bài chạy mục tiêu POST ENGAGEMENT')}
    ${postCard('🎬 THRUPLAY · tỷ lệ xem cao nhất','bg-purple','chart',thruBest,thruHasViews?(thruBest?numC(thruBest.thruplay)+' lượt xem':''):'Theo tương tác (thiếu cột lượt xem)',thruBest?(thruHasViews?thruRate:pct(thruBest.engrate)):'—','Chỉ bài chạy mục tiêu THRUPLAY')}
  </div>`;
  // detail table with expandable daily rows
  const dayByUrl={};P.adsP.forEach(r=>{const u=r.url||'(không rõ link)';(dayByUrl[u]=dayByUrl[u]||{});const k=ymd(r.date);(dayByUrl[u][k]=dayByUrl[u][k]||[]).push(r);});
  const head=['','Bài viết','Mục tiêu','Dạng nội dung','Đã chi','Hiển thị','Tiếp cận','Người nhắn tin','CP/người nhắn','Tương tác','CP/tương tác','Tỷ lệ xem','CTR'];
  let rowsHtml='';
  posts.forEach((p,idx)=>{
    const vr=p.impr&&p.thruplay?pct(div(p.thruplay,p.impr)*100,1):'—';
    rowsHtml+=`<tr class="exp-row" id="row-${idx}" onclick="togglePost(${idx})">
      <td><span class="exp-caret">▸</span></td>
      <td><a href="${esc(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--accent);font-weight:700;text-decoration:none">${shortUrl(p.url)} ↗</a></td>
      <td>${esc(p.goal)}</td><td>${esc(p.type)}</td><td>${vndC(p.spend)}</td><td>${numC(p.impr)}</td><td>${numC(p.reach)}</td>
      <td>${nf(p.msg)}</td><td>${p.msg?vndC(p.cpl):'—'}</td><td>${numC(p.eng)}</td><td>${p.eng?vndC(div(p.spend,p.eng)):'—'}</td>
      <td>${vr}</td><td>${pct(p.ctr,2)}</td></tr>`;
    const dmap=dayByUrl[p.url]||{};const dks=Object.keys(dmap).sort();
    const dRows=dks.map(k=>{const ds=sumAds(dmap[k]);return `<tr><td>${dmy(parseDate(k))}</td><td>${vndC(ds.spend)}</td><td>${numC(ds.impr)}</td><td>${nf(ds.msg)}</td><td>${ds.msg?vndC(ds.cpl):'—'}</td><td>${numC(ds.eng)}</td><td>${pct(ds.ctr,2)}</td></tr>`;}).join('');
    rowsHtml+=`<tr class="exp-detail" id="det-${idx}"><td colspan="${head.length}"><div class="exp-inner">
      <table><thead><tr><th>Ngày</th><th>Đã chi</th><th>Hiển thị</th><th>Người nhắn tin</th><th>CP/người nhắn</th><th>Tương tác</th><th>CTR</th></tr></thead><tbody>${dRows||'<tr><td colspan="7" style="text-align:center;color:var(--muted)">—</td></tr>'}</tbody></table>
    </div></td></tr>`;
  });
  html+=card('Chi tiết hiệu suất từng bài viết · '+P.label,'Gộp theo link bài · nhấn dòng để mở/thu gọn chỉ số theo ngày',
    `<div class="tbl-wrap"><table style="min-width:1080px"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`);
  setC(html);
}
</script>
